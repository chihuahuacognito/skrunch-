<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Posts Review</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--muted:#6f6c66;--line:#e3e0da;
  --keep:#2f7d4f;--keep-bg:#e3f2e8;--drop:#b2412f;--drop-bg:#f8e4e0;--accent:#3a5bd9;--hint:#8a6d1f;--hint-bg:#f7efd9;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--panel:#1d1d1b;--ink:#ecebe7;--muted:#9c9890;--line:#33322f;
  --keep:#6cc28d;--keep-bg:#1f3428;--drop:#e98a78;--drop-bg:#3a2420;--accent:#8ea4ff;--hint:#e3c56f;--hint-bg:#3a321c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0 8px 0 0}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 10px;cursor:pointer;font:inherit}
.seg button.on{background:var(--ink);color:var(--bg)}
.stats{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
#toast{color:var(--hint);font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--muted)}
main{flex:1;display:flex;min-height:0}
#list{width:300px;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}
#list div{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:baseline}
#list div.cur{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
#list .dot{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid var(--muted)}
#list .dot.keep{background:var(--keep);border-color:var(--keep)}
#list .dot.discard{background:var(--drop);border-color:var(--drop)}
#list .dot.need{box-shadow:0 0 0 2px var(--hint)}
#list .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .o{color:var(--muted);font-size:12px;flex:none}
#view{flex:1;overflow-y:auto;padding:20px 24px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:24px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:10px}
.meta .owner{font-weight:600;font-size:16px}
.meta .m{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip.guess{background:transparent;color:var(--accent);border:1px dashed var(--accent)}
.flag{background:var(--hint-bg);color:var(--hint);border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:13px}
.actions{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.actions .btn{padding:9px 16px;font-weight:600}
.actions .k.on{background:var(--keep-bg);border-color:var(--keep);color:var(--keep)}
.actions .d.on{background:var(--drop-bg);border-color:var(--drop);color:var(--drop)}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 5px;display:flex;gap:8px;align-items:baseline}
.lbl em{text-transform:none;letter-spacing:0;font-style:normal}
.dd-head{display:flex;gap:6px;align-items:flex-start}
.dd-toggle{flex:1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 30px 6px 8px;min-height:34px;cursor:pointer;font:inherit;position:relative}
.dd-toggle::after{content:"▾";position:absolute;right:10px;top:7px;color:var(--muted)}
.dd.open .dd-toggle{border-color:var(--accent)}
.dd-toggle .none{color:var(--muted);font-size:13px}
.dd-ok{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:6px 8px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.dd-ok:hover{border-color:var(--accent);color:var(--accent)}
.dd-panel{margin-top:4px;border:1px solid var(--accent);border-radius:8px;background:var(--panel);padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 8px;max-height:280px;overflow-y:auto}
.dd-panel label{display:flex;gap:6px;align-items:center;padding:3px 4px;border-radius:5px;cursor:pointer;font-size:13px}
.dd-panel label:hover{background:var(--bg)}
.dd-panel input[type=checkbox]{accent-color:var(--accent)}
.dd-new{grid-column:1/-1;margin-top:4px;background:var(--bg);color:var(--ink);border:1px dashed var(--line);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px}
.badge{border-radius:8px;padding:5px 10px;font-size:13px;margin:14px 0 6px}
.badge.ok{background:var(--keep-bg);color:var(--keep)}
.badge.need{background:var(--hint-bg);color:var(--hint)}
textarea{width:100%;min-height:54px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;resize:vertical;margin-bottom:12px}
textarea.moves{min-height:70px}
.cap{white-space:pre-wrap;word-wrap:break-word;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.embed{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center}
.embed iframe{width:100%;height:720px;border:0;display:block;background:#fff}
.embed .off{color:var(--muted);padding:30px;text-align:center}
.help{color:var(--muted);font-size:12px;margin-top:14px}
a{color:var(--accent)}
.empty{color:var(--muted);text-align:center;margin-top:80px}
@media (max-width:900px){
  #list{display:none}
  .wrap{grid-template-columns:1fr}
  #view{padding:16px}
  .embed iframe{height:600px}
}
</style>
</head>
<body>
<header>
  <h1>Saved posts</h1>
  <div class="seg" id="groupSeg"></div>
  <div class="seg" id="statusSeg"></div>
  <span class="stats" id="stats"></span>
  <span id="toast" role="status"></span>
  <button class="btn" id="importBtn" title="Load an earlier review-decisions.json">Import decisions</button>
  <input type="file" id="importInput" accept=".json,application/json" hidden>
  <button class="btn" id="exportBtn" title="Download your decisions as JSON">Export decisions</button>
</header>
<main>
  <nav id="list"></nav>
  <section id="view"></section>
</main>

ck"], "types": ["stretch"], "purposes": ["lower back comfort"]}}, {"id": "DeNXuYRII52", "url": "https://www.instagram.com/reel/DeNXuYRII52/", "owner": "kivenro.flexibility", "time": "Oct 12, 2026 8:22 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Does your lower back often feel tight? 👀\n\nTry this gentle movement to ease tension and help your lower back feel more relaxed, moving slowly, breathing deeply, and never forcing the stretch\n\nAnd if you’re generally dealing with stiffness, poor posture, or a lack of flexibility, I’ve got something for you 👇\n\nFollow my beginner-friendly stretching routine and start seeing results in less than 7 days, no equipment needed — link in bio ✅\n\n#mobility #posture #lowerback #flexibility #backstretch", "listed": false, "note": null, "guess": {"muscles": ["lower back"], "types": ["mobility", "stretch"], "purposes": ["lower back comfort", "desk breaks"]}}, {"id": "Dd3x49fkUii", "url": "https://www.instagram.com/p/Dd3x49fkUii/", "owner": "findingmorgantyler", "time": "Oct 10, 2026 5:32 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "also comment HIPS and I’ll DM ya a free weeks of 30+ workouts 😋\n\nIf you’re a beginner and literally everything on the internet looks intimidating af, you probably just need LESS to begin, and a workout program that doesn’t make you hate your life. I don’t make the rules! 🤭\n\nBut I do create bite-sized classes you can do anywhere cozied up in your cute lil home! How’s that sound? \n\nToday we are rolling through each of these exercises once for 60 seconds (both sides if single-sided please!). You’ll be fine and dusted in 8 minutes: \n\n✨elevated leg lifts\n✨ lateral leg raises \n✨ clamshell raises \n✨ seated heel taps \n✨ adductor raises \n\nDo this with your favorite emotional support bevy and I’ll meet you there!!! \n\nxoxo your tea-sipping coach ☕️", "listed": false, "note": null, "guess": {"muscles": ["abdominals", "hip flexors", "adductors"], "types": [], "purposes": []}}, {"id": "DeRtqK-IVR9", "url": "https://www.instagram.com/reel/DeRtqK-IVR9/", "owner": "romavelych", "time": "Oct 10, 2026 5:14 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "🧠💪 12 Exercises for a Stronger Back \u0026 Healthier Shoulders\n\nThese 12 exercises are designed to strengthen your back, improve shoulder stability, and support better posture and movement quality 🏊‍♂️🏐🏋️‍♂️ They are especially useful for swimmers, volleyball players, gym enthusiasts, and anyone who wants stronger, more resilient shoulders and back.\n\n✅ Improve shoulder mobility and stability\n✅ Strengthen the upper and mid-back muscles\n✅ Support better posture and spinal control\n✅ Reduce muscular overload and injury risk\n\n⏱ How to perform:\n• 20-30 seconds per exercise\n• 2-3 sets\n• 2-3 times per week\n\n📌 Move slowly and with control, focus on proper technique, and stay consistent 🔥 Quality of movement is always more important than speed.\n\n#shoulders #back #pain #exercises #health", "listed": true, "note": null, "guess": {"muscles": ["middle back", "shoulders"], "types": ["mobility", "stability"], "purposes": ["desk breaks", "shoulder health"]}}, {"id": "DeOwTlTyqlK", "url": "https://www.instagram.com/reel/DeOwTlTyqlK/", "owner": "santemoves", "time": "Oct 08, 2026 5:30 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "Comment “community” for the Modern Body Fix program\n\nFound inside the Movement Skool\n\nLower back pain needs strength from the erectors \n\nStability from the core\n\nAnd reduced compensation from the hips \n\n#mobilitytraining #movement #lowerbackpain #coretraining #hipmobility", "listed": false, "note": null, "guess": {"muscles": ["abdominals", "lower back", "hip flexors"], "types": ["mobility", "stability"], "purposes": ["lower back comfort"]}}, {"id": "DdDul4RoPql", "url": "https://www.instagram.com/p/DdDul4RoPql/", "owner": "nainkim", "time": "Oct 06, 2026 7:52 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "어때요, 저 혼자서도 잘하죠ㅋ🤭\n.\n.\n#엘리트짐 #어깨운동 #피치빌더 #멀티힙익스텐션 #업라이트로우", "listed": false, "note": null, "guess": {"muscles": ["middle back", "shoulders"], "types": [], "purposes": []}}, {"id": "Ddy56ptiyAv", "url": "https://www.instagram.com/reel/Ddy56ptiyAv/", "owner": "squat_university", "time": "Oct 01, 2026 9:28 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Don’t forget - the real role of your core is to stabilize your spine and facilitate force transfer amongst your arms and legs. This doesn’t mean training for strength or hypertrophy is wrong - just make sure you have a baseline of stiffness FIRST!\n.\nShout out @muscleandmotion for the amazing anatomy graphics \u0026 @sandyfit.mx for her Ab flex at the start!", "listed": false, "note": null, "guess": {"muscles": ["abdominals"], "types": ["stability"], "purposes": []}}, {"id": "Dd1guz2irP_", "url": "https://www.instagram.com/reel/Dd1guz2irP_/", "owner": "squat_university", "time": "Sep 29, 2026 5:26 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Mobility work doesn’t always mean stretching! \n.\nShout out @laget_om_ka for the opening stitched video \u0026 @muscleandmotion for the amazing anatomy graphics.", "listed": false, "note": null, "guess": {"muscles": [], "types": ["mobility", "stretch"], "purposes": []}}, {"id": "DdurtCRBnST", "url": "https://www.instagram.com/reel/DdurtCRBnST/", "owner": "thesyalieboo", "time": "Sep 26, 2026 6:42 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Time for you to invest in a pain-free version of you 🙌🏼\nSome movements for you to incorporate into your routines before your heavy lifts, before a run, in the mornings, before work, after work, before uni, after uni, before a night out, before a date, before bed, whenever. \n\n#mobility #hipmobility #movement #training #routine", "listed": false, "note": null, "guess": {"muscles": [], "types": ["mobility"], "purposes": []}}, {"id": "Ddt0prooiW8", "url": "https://www.instagram.com/reel/Ddt0prooiW8/", "owner": "coachgreen.pt", "time": "Sep 26, 2026 4:02 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "If you sit a lot, give these four exercises a try.\n\nYou’ll stretch your hip flexors and work on both internal and external hip rotation. That can help when your hips feel tight after sitting for a long time.\n\nYou’ll also strengthen the muscles around your knees and hips, along with your core, glutes and hamstrings. That can give your lower back more support and help if you often feel tension or pain there.\n\nMove with control and stay within a range that feels good.", "listed": false, "note": null, "guess": {"muscles": ["abdominals", "lower back", "hip flexors", "glutes", "hamstrings"], "types": ["stretch", "stability"], "purposes": ["hip flexors / sitting stiffness", "lower back comfort", "desk breaks", "knees"]}}, {"id": "DdnHG4KARt4", "url": "https://www.instagram.com/reel/DdnHG4KARt4/", "owner": "squat_university", "time": "Sep 23, 2026 10:10 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "How often (if at all) do you single leg RDL? \n.\nShout out @heathermoraski for the opening stitched video \u0026 @muscleandmotion for the amazing anatomy graphics.", "listed": false, "note": null, "guess": {"muscles": ["hamstrings"], "types": [], "purposes": []}}, {"id": "DdljRT0TmIk", "url": "https://www.instagram.com/reel/DdljRT0TmIk/", "owner": "hironori_nakajima", "time": "Sep 22, 2026 8:28 pm", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "【Dynamic Hip Stretches for Lower Back Pain Prevention】\n腰痛予防の為の股関節動的ストレッチ", "listed": false, "note": null, "guess": {"muscles": ["lower back", "hip flexors"], "types": ["stretch"], "purposes": ["lower back comfort"]}}, {"id": "DdkE4jji9r5", "url": "https://www.instagram.com/reel/DdkE4jji9r5/", "owner": "squat_university", "time": "Sep 21, 2026 9:32 pm", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Here’s a dead bug progression @lidayin89kg performed during his back injury rehab. The lower body is engaged isometrically to resist the band pull while the arms move the barbell overhead. This becomes an anti-extension exercise as the core must remained stiffened in order to prevent the lower back from arching as the arms move. The engaged lower body, stiffened core in a neutral posture and arms supporting load overhead is designed to mimic the Olympic lifting positions.\nKey points: stiffen the core THEN move the arms or legs with the dead bug. This is only one way to progress the classic movement for an increased challenge. Don’t progress faster than you should \u0026 lose your spinal positioning!!!!\n.\nShout out to @primal.physio \u0026 @luxiaojunbarbell \u0026 @mohamedkine1 for the footage used in today’s post.", "listed": false, "note": null, "guess": {"muscles": ["abdominals", "lower back"], "types": ["strength", "stability"], "purposes": ["lower back comfort", "desk breaks"]}}, {"id": "DdVNUdEvOfF", "url": "https://www.instagram.com/reel/DdVNUdEvOfF/", "owner": "proformance_sportstherapy", "time": "Sep 17, 2026 2:33 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "Here’s your wrist \u0026 forearm cheat sheet 👇\n\n1. Towel Roll\n\n2. Plate Catches\n\n3. Pronation\n\n4. Supination \n\nTry these during your next mobility \u0026 strengthening session to improve your wrist health.", "listed": true, "note": "Shares 3 of 4 exercises with DZ6GmmMPS_u", "guess": {"muscles": ["forearms"], "types": ["mobility"], "purposes": ["wrists"]}}, {"id": "DdKXTwNjMfD", "url": "https://www.instagram.com/p/DdKXTwNjMfD/", "owner": "backpainacademy", "time": "Sep 16, 2026 8:02 pm", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Hip mobility and core control both play an important role in how your body moves. A few simple exercises can help you build strength, coordination, and awareness around the pelvis and trunk.\n\nThis routine may help:\n✅ Improve hip mobility and movement control\n✅ Strengthen the deep core and trunk muscles\n✅ Develop better pelvic control during movement\n✅ Support comfortable lower-back movement\n✅ Improve stability for everyday activities\n\nFor the pelvic control exercise, focus on slowly moving between positions rather than forcing your spine into a bigger range. Holding the rounded position briefly while gently engaging the core can help you practice controlling the pelvis and trunk.\n\nIt’s important to remember that a “belly pooch” is not always caused by weak muscles or pelvic position. Abdominal shape is influenced by many factors, including body composition, anatomy, digestion, and genetics. Core exercises can improve strength and control, but they cannot specifically reduce fat from one area.\n\nSimilarly, uneven hips and posture differences are common. They don’t always indicate a problem that needs to be “corrected.” Improving strength, mobility, and coordination can help many people move more comfortably without needing perfect symmetry.\n\nPerform around 10 repetitions for 2–3 sets, adjusting the volume to your ability. Move slowly and stay within a comfortable range.\n\nThese exercises may help ease stiffness or improve movement control, but they aren’t guaranteed to relieve back pain or fix the underlying cause. If you have persistent, severe, or worsening pain, or symptoms such as numbness, tingling, weakness, or radiating pain, consult a qualified healthcare professional.\n\n⚠️ Educational purposes only. Not medical advice.\n\nvia @rehab.wizard", "listed": true, "note": null, "guess": {"muscles": ["abdominals", "lower back", "hip flexors"], "types": ["mobility", "stability"], "purposes": ["lower back comfort", "desk breaks"]}}, {"id": "DdTFFSIB0Lx", "url": "https://www.i g bigger legs.\n\nIt’s building legs that absorb force better, produce more power and stay injury-free for longer.\n\nThat’s why exercises like split squats, step-ups, plyo’s, isometrics and lower-leg work have become staples in my training.\n\nTrain for the outcome you want.\n\nNot just the muscle you want to grow.\n\nComment ‘RUN’ and I’ll DM you my guide 👊🏼", "listed": true, "note": null, "guess": {"muscles": ["quadriceps"], "types": ["strength", "stability"], "purposes": []}}, {"id": "Dbk-9BgBJ32", "url": "https://www.instagram.com/reel/Dbk-9BgBJ32/", "owner": "yogasong_hayeon", "time": "Aug 15, 2026 7:09 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "Don’t ask me why. Just lock in and do it for 3 weeks. Then come back and tell me why it worked!!! 😏\n\nBonus:\n✨ Do it on an empty stomach if you can (morning or/and before bed)\n🔥 Complete 2–3 rounds\n💀 On the last exercise (criss-cross), keep going until you genuinely can’t do another rep with good form…\n\n#strongabs #fitover40 #morningmotivation\n\nDon’t ask me why. Just lock in and do it for 3 weeks. Then come back and tell me why it worked!!! 😏\n\nBonus:\n\n✨ Do it on an empty stomach if you can (morning or/and before bed)\n🔥 Complete 2–3 rounds\n💀 On the last exercise (criss-cross), keep going until you genuinely can’t do another rep with good form…\n\n#strongabs #fitover40 #dailygrind", "listed": false, "note": null, "guess": {"muscles": [], "types": ["conditioning"], "purposes": []}}, {"id": "Da5cU6mI7EV", "url": "https://www.instagram.com/reel/Da5cU6mI7EV/", "owner": "pump_twiins", "time": "Aug 06, 2026 7:10 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "Kettlebell Exercises You Can Do at Home 💪\n\nCan’t make it to the gym? No worries.\nThese kettlebell exercises hit the same muscle groups, so you can still get an effective workout from home. 🔥\n\nSave this post for your next home workout!\n\n#gym #home #viral #kettelbellworkout #hype rawbacks and may not work for everyone.\n\nStability walking is one drill that can bias different zones of abduction and adduction, as well as with internal or external rotation bias. \n\nThis was treated as one extended time under tension set where we trained the position that was the most difficult. \n\nYou can find the whole workout on the BodyBUILDING, not BodyBreaking Youtube channel and more about what we do in our Skool community where we have an extensive exercise library, programs, concepts videos and exclusive training footage. \n\nComment “Skool” and I’ll send over a free invite. 🫡\n\n#BodyBuildingB4BodyBreaking \n#RedefiningThePractice \n#BrawnMeetsBrain", "listed": false, "note": null, "guess": {"muscles": ["shoulders"], "types": ["stability"], "purposes": []}}, {"id": "DaQ8Gc_igCV", "url": "https://www.instagram.com/reel/DaQ8Gc_igCV/", "owner": "squat_university", "time": "Jul 01, 2026 7:56 pm", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Amazing core stability drills to try! \n.\nShout out @alignwithles and @jahwellness_llc for the opening stitched video \u0026 @muscleandmotion for the amazing anatomy graphics.", "listed": false, "note": null, "guess": {"muscles": ["abdominals"], "types": ["stability"], "purposes": []}}, {"id": "DY8wU8attFl", "url": "https://www.instagram.com/reel/DY8wU8attFl/", "owner": "fit___dad", "time": "Jun 30, 2026 8:01 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "One Kettlebell. 20 Minutes.  As Many Rounds As Possible. \nThis will humble you. \n\nIf you’re a busy parent trying to stay lean, strong, and athletic without spending hours in the gym, this one checks every box.\n\nThis workout combines pulling, hinging, squatting, pressing, rotation, and anti-rotation into one brutal full-body conditioning session. By the time you finish a round, your grip, legs, shoulders, core, and lungs will all be working overtime.\n\n⏱️ 20 Minute AMRAP (As Many Rounds As Possible)\n\n• 12 Bent Over Rows\n• 12 Swings\n• 12 Goblet Squats\n• 12 Thrusters\n• 12 Devil’s Halos (6 each direction)\n• 12 Around the Worlds (12 each direction)\n\nWhy this complex works:\n✅ Builds full-body strength\n✅ Improves muscular endurance\n✅ Increases conditioning and work capacity\n✅ Trains rotational and anti-rotational core strength\n✅ Burns a ton of calories in a short amount of time\n\nI used a 20KG / 44lb kettlebell for this workout.\n\nMy recommendation: Start lighter than you think.\n\nThe weight should challenge you and push you close to failure by the end of each round, but you should still be able to complete every rep with good form. Quality movement always beats ego lifting.\n\nSave this workout for your next full-body training day.\n\nSend it to the friend who says kettlebell workouts are easy.\n\nFollow @fit___dad for daily functional strength and conditioning workouts you can copy in 45 minutes or less.", "listed": true, "note": null, "guess": {"muscles": ["abdominals", "quadriceps", "middle back", "shoulders"], "types": ["strength", "conditioning", "stability"], "purposes": []}}, {"id": "DaGQnhHs4jT", "url": "https://www.instagram.com/reel/DaGQnhHs4jT/", "owner": "markus.moves", "time": "Jun 28, 2026 8:18 pm", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Your posture is stealing your energy\n\nIf you feel “puffy” in the lower belly, get random back pain, and your shoulders round forward…\n\nThis is a positioning \u0026 weak support problem my friend\n\nHere’s the routine that fixes all 3 at once:\n\n✅ Flatten the lower belly (without crunches)\n✅ Take pressure off the low back by building real core stability\n✅ Fix anterior pelvic tilt so you stand taller automatically\n✅ Open the chest + align shoulders to stop the “hunched” look\n\n### Do this today\n\n1️⃣ Run the full sequence for 15 minutes\n2️⃣ Move slow and focus on control, not speed\n3️⃣ Save this and repeat 3–4x/week\n\n— Markus", "listed": true, % off with code coachj25off through May)\n\n#fitness #workout #homeworkout mobility", "listed": true, "note": null, "guess": {"muscles": [], "types": ["mobility"], "purposes": []}}, {"id": "DX9R8wQtOrK", "url": "https://www.instagram.com/reel/DX9R8wQtOrK/", "owner": "marielaxfit", "time": "May 08, 2026 8:55 pm", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Friendly reminder: train your hip flexors, and don’t skip your mobility work 🤍 \n\nOutfits: @underarmourwomen \n\n#hipmobility #hipflexors #hipflexibility #mobilitytraining #mobilitymatters", "listed": false, "note": null, "guess": {"muscles": ["hip flexors"], "types": ["mobility"], "purposes": ["hip flexors / sitting stiffness"]}}, {"id": "DXH21Gek7W7", "url": "https://www.instagram.com/reel/DXH21Gek7W7/", "owner": "anyaturner98", "time": "Apr 15, 2026 3:30 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "Knee pain isn’t always random, it can come from things you can actually do something about! \n\n✨Your quads, esp the VMO (tear drop shape muscle on your inside of your quad) is the main stabiliser of the knee. Having strong quads help your knee track properly and absorb load.\n\n✨ Your hamstringa protect the knee by balancing the forces from your quads. Think of them as the knee’s safety net!\n\n✨ Your hips guide your knee. When they are weak or immobile they can make your knee collapse inward and take extra stress. (Remember your hips move in 7 different ways!)\n\n✨ Ankles \u0026 calves are your first line of impact absorption. If they aren’t strong or mobile enough, the knee ends up taking the hit.\n\n✨ Too much impact, too fast  like jumping into high mileage or high impact activities without prep overloads the knee. Gradual loading is key!\n\n#runner #kneepainrelief #knee #healthyjoints #movementismedicine", "listed": false, "note": null, "guess": {"muscles": ["hip flexors", "quadriceps", "hamstrings", "calves"], "types": [], "purposes": ["knees"]}}, {"id": "DVf5SGckd8q", "url": "https://www.instagram.com/reel/DVf5SGckd8q/", "owner": "seungwon5", "time": "Mar 28, 2026 6:02 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "1. Camel Pose. This opens your chest and shoulders while stretching the front of your body. It can help those with neck, shoulder, or back pain, or those with rounded shoulders.\n\n2. Stretches the lower back and spine. After extending the lower back, rise up in a natural wave motion, pressing down firmly to straighten the back.\n\n3. The Cosacks Squat. Improves mobility in the hips, ankles, and inner thigh adductors.\n\n4. World's greatest stretch. This movement combines hip flexors, adductors, and thoracic spine rotation. The final position relaxes the hamstrings.\n\n5. Thoracic spine rotation performed in a deep squat position. It improves mobility in the hips, ankles, and thoracic spine. Hamstring stretching can also be added.\n\n6. A thoracic spine rotation stretch performed in the 90-90 position. It improves hip internal and external rotation, as well as thoracic spine rotation. At the end, you can relax the oblique lines while engaging the hip flexors and glutes.\n\nDoing all six is ideal, but if time is limited, choose three movements and repeat them 10 times each day.\n\nThey will be very helpful in your daily life.\n\n6 Exercises You Should Do Every Day\n\n-\n\n매일 하면 좋은 6가지 동작\n\n1.\n낙타 자세입니다. 가슴과 어깨를 열어주면서 몸의 앞면을 스트레칭할 수 있습니다. 목, 어깨, 등 통증이 있거나 라운드숄더 체형이신분에게 도움이 될 수 있습니다.\n\n2. 허리와 등을 스트레칭합니다. 허리 신전 후 자연스럽게 웨이브를 타며 일어나 아래로 꾹 눌러주면서 등을 펴줍니다. \n\n3. 코삭스쿼트입니다. 고관절, 발목, 허벅지 안쪽 내전근의 가동성을 향상시킬 수 있습니다.\n\n4. 고관절 굴곡근, 내전근, 흉추 회전을 결합한 동작입니다. 마지막 동작에서는 햄스트링을 이완시킵니다. \n\n5. 딥스쿼트 자세에서 하는 흉추 회전 동작입니다. 고관절과 발목, 흉추의 가동성을 향상시킵니다. 햄스트링 스트레칭 또한 추가할 수 있습니다.\n\n6. 9090 자세에서 하는 흉추 회전 스트레칭입니다. 고관절의 내회전과 외회전, 흉추의 회전을 향상시킵니다. 마지막에는 고관절 굴곡근과 둔근까지 함께 사용하면서 옆구리 라인을 이완시킬 수 있습니다.\n\n6가지 모두 하면 좋지만 시간이 없다면 3가지 동작을 정해서 하루에 10회씩 반복해주세요.\n\n일상에 많은 도움이 될 겁니다.", "listed": true, "note": null, "guess": {"muscles": ["abdominals", "lower back", "hip flexors", "adductors", "glutes", "quadriceps", "hamstrings", "chest", "shoulders", "neck", "thoracic spine"], "types": ["strength", "mobility", "stretch"], "purposes": ["hip flexors / sitting stiffness", "lower back comfort"]}}, {"id": "DV-VOdVD4oI", "url": "https://www.instagram.com/reel/DV-VOdVD4oI/", "owner": "fluidxbyrosie", "time": "Mar 22, 2026 6:12 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "The exercise helped me fix the lower back pain.\n👉🏼 The Hip Flexor Sit-Up.\n\nSitting all day?\nYour hips get tight.\nYour core gets weak.\nAnd your lower back ends up doing all the work.\n\nThat’s how a lot of back pain starts.\n\n👉🏼The ‘Hip Flexor Sit-up’ is a great fix. \nWhat makes it powerful is simple : it stretches tight hip flexors while strengthening them at the same time.\n\nIf you sit a lot, this can be a great reset for your hips and core.\n\n💪🏼 Do 2 sets | 8-12 reps (Don’t go too low if you’re a beginner. Only lean back as far as you can control!) \n\nToo tough? Start with these moves👇🏼\n(1-2 sets | 15 reps each) \n1️⃣ Lying Hip Flexor Straight Leg Lift\n2️⃣ Standing Cable Hip Flexion\nStop letting your back do all the work. \n\n💾 Save this and try it later.\nFollow for more heath tips 🥰\n\nAnatomy clips by @muscleandmotion \n#fluidxbyrosie #fixlowerbackpain #weakhipflexors #hipflexorsitups", "listed": true, "note": null, "guess": {"muscles": ["abdominals", "lower back", "hip flexors"], "types": ["strength", "stretch", "stability"], "purposes": ["hip flexors / sitting stiffness", "lower back comfort", "desk breaks"]}}, {"id": "DWJJkolkaYS", "url": "https://www.instagram.com/reel/DWJJkolkaYS/", "owner": "seungwon5", "time": "Mar 21, 2026 7:46 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "고관절 굴곡근이 타이트하신가요? 그렇다면 이 운동들을 시작해 보세요.\n\n스트레칭과 가동성, 근력 운동을 포함한 16가지 운동입니다.\n\n1~4는 스트레칭,\n5는 고관절 가동성,\n6~16까지가 근력 운동입니다.\n\n운동 시작 전 해당 부위를 마사지하고 시작해 주면 더 좋습니다.\n\n16가지 운동을 전부 다 할 필요는 없지만 골고루 섞어서 해주는 게 더 좋습니다.\n순서는 스트레칭, 가동성 운동, 근력 운동 순으로 해주세요.\n\n어떻게 시작해야 할지 모르겠다면 이렇게 해보세요.\n\n1~4중 스트레칭 하나를 골라주세요.\n5번은 필수적으로 운동해 주세요.\n6~16 중 3가지 운동을 골라주는데 그중에서 16번은 꼭 넣어서 운동해 주세요.\n\n스트레칭은 2세트 30초, 가동성 운동은 2세트 10회 반복, 나머지 3가지 근력 운동은 2~3세트 12회씩 운동해 주세요.\n\n고관절 굴곡근이 타이트할 때 계속 스트레칭만 하거나 계속 운동만 하는 건 좋지 않습니다. 한 가지로 치우치기 보다 적절하게 운동을 함께 병행하는 게 더 효과적입니다.\n\n꾸준히 운동을 해보고 몸이 어떻게 바뀌는지 확인해 보세요.\n\n#hipflexors", "listed": false, "note": null, "guess": {"muscles": ["hip flexors"], "types": ["mobility", "stretch"], "purposes": []}}, {"id": "DUifR1SAUV6", "url": "https://www.instagram.com/reel/DUifR1SAUV6/", "owner": "yogasong_hayeon", "time": "Mar 18, 2026 12:11 pm", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "It might sound crazy, but I do this either first thing in the morning or as the last thing at night, every day 😳😭\nWhat works for me doesn’t have to work for you, so pick the time that feels most realistic to move and do something for your body.\nStick with it, and you’ll start to see the changes 💪\n\n#dailyabs #fit44 #deepcore #wegotthis\n\nMotion graphics: @baskiii_v 🔥\n\nIt might sound crazy, but I do this either first thing in the morning or as the last thing at night, every day 😳😭\nWhat works for me doesn’t have to work for you, so pick the time that feels most realistic to move and do something for your body.\nStick with it, and you’ll start to see the changes 💪✨\n\n#dailyabs #fit44 #wegotthis\n\nMotion graphics: @baskiii_v", "listed": false, "note": null, "guess": {"muscles": [], "types": [], "purposes": []}}, {"id": "DTkgruKknAY", "url": "https://www.instagram.com/reel/DTkgruKknAY/", "owner": "gymjimpt", "time": "Mar 18, 2026 10:52 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Runners using the program “Run Ready” are fixing injuries, improving mobility and building strength where it matters most\n\nTry it for free if you DM me “Trial” \n\n#runready #mobility #runners", "listed": false, "note": null, "guess": {"muscles": [], "types": ["mobility"], "purposes": []}}, {"id": "DVv4LhMDIyI", "url": "https://www.instagram.com/p/DVv4LhMDIyI/", "owner": "tomwilsonleonard", "time": "Mar 18, 2026 10:45 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "If I only had 10 minutes for mobility, I’d start here.\n\nNot because these movements are new.\n\nMany of them I’ve already shared over the last few months. Mobility isn’t about constantly adding more exercises. It’s about revisiting the same patterns again and again so the body can learn them more deeply.\n\nRepetition is part of the practice.\n\nMove slowly. Breathe through the transitions. Let each movement build on the last.\n\nThe sequence:\n\n1 Hip Airplanes\nStanding on one leg, rotate the pelvis open and closed while keeping the standing hip stable. Builds control through the hip.\n\n2 Reverse Table Top External Rotation\nPress the hips up, gently rock forward and back, then add small side shifts. Opens the shoulders and front of the hips.\n\n3 Camel to Flexion\nLift the chest into extension, then fold forward bringing the head toward the floor. Moves the spine through extension and flexion.\n\n4 Low Lizard Twist\nFrom a deep lunge rotate through the ribcage allowing the chest to open. Restores thoracic rotation while the hips stay grounded.\n\n5 Kneeling Twists with Gaze\nRotate through the torso while the eyes follow the movement. Linking gaze with movement helps organise rotation.\n\n6 Cat Cow (leg extended)\nMove slowly between flexion and extension while the extended leg challenges hip stability.\n\n7 Kneeling Side QL Stretch\nReach through the side body to lengthen the lateral chain.\n\n8 Pigeon to Internal Rotation\nMove between external and internal rotation of the hip to restore balance around the joint.\n\n9 Wide-Leg Forward Fold with Rotation\nOne hand grounded, the other reaching up as the chest rotates open.\n\n10 Gentle Cossack\nShift side to side keeping both feet grounded to load the adductors.\n\nFollow-along mobility like this lives inside my programme “If I Only Have 10 Minutes.”\n\nIf you’d like the details, comment 10MINS and I’ll send it to you.", "listed": false, "note": null, "guess": {"muscles": ["lower back", "hip flexors", "adductors", "quadriceps", "chest", "shoulders", "thoracic spine"], "types": ["strength", "mobility", "stretch", "stability"], "purposes": ["lower back comfort"]}}, {"id": "DVOLfkVihvD", "url": "https://www.instagram.com/reel/DVOLfkVihvD/", "owner": "waifumani", "time": "Mar 18, 2026 8:24 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "3 easy exercises to loosen tight hips and increase mobility", "listed": false, "note": null, "guess": {"muscles": ["hip flexors"], "types": ["mobility"], "purposes": ["hip flexors / sitting stiffness"]}}, {"id": "DVyKrZDgGkw", "url": "https://www.instagram.com/reel/DVyKrZDgGkw/", "owner": "narplifecrisis", "time": "Mar 17, 2026 8:31 pm", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "MY CORE ROUTINE 😮‍💨\nswimming is a already great core workout, especially if you’re incorporating kick + underwater sets! i like to double up on core on the few days that i do get in the water and finish off my swims with a short ab circuit. here it is:\n\n3 ROUNDS:\n 25, 15, 5 for each exercise reps by round\n (no breaks within a round, go straight into each exercise)\n - v-ups\n - reverse crunch (SLOW and controlled on the way down, try and lower your torso + legs down together)\n - toe touches\n - 30sec flutter kick\n  break between each round!\n\ni started doing this while i was still competing to help strengthen my kick in the water. even though i’m not swimming competitively anymore, it’s just such a great set i had to keep doing it!\n\n#coreworkout #abworkout #crosstraining #fitnessinspo #workoutinspo", "listed": true, "note": null, "guess": {"muscles": ["abdominals"], "types": ["conditioning", "stability"], "purposes": []}}, {"id": "DV84EKLEZ_d", "url": "https://www.instagram.com/reel/DV84EKLEZ_d/", "owner": "jasonandlaurenpak", "time": "Mar 17, 2026 12:52 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "You need more than external rotations for your rotator cuff!\n\nOne of the roles of your rotator cuff is to externally rotate. But, its *primary* role is to provide dynamic stability at your shoulder.\n\nER drills are important to do, but make sure you also include moves like the ones shown in this video into your routine!\n \nShoes from @vivobarefoot (use code PAK15)\n. \n.\n#theoryofmotion #jasonandlaurenpak #shoulder #rotatorcuff", "listed": false, "note": null, "guess": {"muscles": ["shoulders"], "types": ["stability"], "purposes": ["shoulder health"]}}, {"id": "DVs-M9Kjagz", "url": "https://www.instagram.com/p/DVs-M9Kjagz/", "owner": "garcia_effect_official", "time": "Mar 16, 2026 12:26 pm", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "10 exercises for those who sit a lot or spend prolonged time at a desk / computer (Online complete lower back program 80+ exercises with audio, sets, reps, and videos,link in bio)🔥\n--\nFREE jump program, which has transformed over 50,000 athletes from across the world, blue link in bio ✈️\n--\n🚨NOW GET ALL 12 OF MY PROGRAMS FOR LESS THAN $13. From performance, to rehab, to nutrition. The programs that have transformed over 100,000 athletes over the last 10 years. LESS THAN $13, blue link in my bio🚨\n--\nMain issues when sitting for prolonged amounts of time are stiffness in the spine, weakens in the hips, tightness in the hips, tightness in the ankles and lower back. All of these exercises are designed to fix those issues 💯\n--\nLooking to transform your lower back health with AUDIO INSTRUCTION , sets and reps?⬇️\n--\nONLINE LOWER BACK REHAB (9-week program)\n💪🏽Day by day FULL AUDIO exercise breakdown sets + reps\n🎥Over 80+ Video references of all exercises \u0026 stretches\n🤕Description, causes, and diagnosis of common back injuries\n👣Improve Lower back strength \u0026 Mobility \n💥Decrease back pain\n‼️Increase Mobility\n💯Prevent back injury\n✅All in convenient PDF", "listed": true, "note": "Same caption as DUvgNddjdlY (likely repost)", "guess": {"muscles": ["lower back", "hip flexors"], "types": ["mobility", "stretch"], "purposes": ["lower back comfort", "desk breaks"]}}, {"id": "DV1csy-E9S-", "url": "https://www.instagram.com/reel/DV1csy-E9S-/", "owner": "anyaturner98", "time": "Mar 14, 2026 12:07 pm", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "Stretching daily but still feeling tight? 🤔 Try these mobility moves to finally loosen up and strengthen your hammys ! \n\nIt might be time to add some active mobility.\n\nTry these moves 👇🏼\n\n✨ 2-3 set of 10ea or 30s\n\n#mobility #movementismedicine #hamstrings #runner #atmovementlab", "listed": false, "note": null, "guess": {"muscles": ["hamstrings"], "types": ["mobility", "stretch"], "purposes": []}}, {"id": "DV0ow0XgThT", "url": "https://www.instagram.com/p/DV0ow0XgThT/", "owner": "jongkeungil", "time": "Mar 13, 2026 8:09 pm", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "🔽푸시업(Push Up) 손 위치별 자극 차이 5가지🔽\n🔸5 Push-Up Hand Position Changes🔥\n\n1. 클로즈 뉴트럴 그립 푸시업(Close Neutral-Grip Push-Up)\n- 손 간격을 좁고 손끝이 서로 마주보는 느낌으로 두고 수행하면 가슴 안쪽(inner chest)과 삼두(triceps)에 자극에 효과적입니다.\n\n2. 기본 뉴트럴 그립 푸시업(Standard Neutral-Grip Push-Up)\n- 어깨너비 기준으로 가장 편안한 손 위치에서 수행하면 가슴 전체(chest overall)를 균형 있게 자극할 수 있어 가장 기본적인 푸시업입니다.\n\n3. 리버스 그립 푸시업(Reverse-Grip Push-Up)\n- 손끝이 몸쪽을 향하도록 손목 각도를 바꿔 수행하면 가슴 상부(upper chest)에 자극이 더 강조되어 상부 라인을 만들기에 도움이 됩니다.\n\n4. 파이크 푸시업(Pike Push-Up)\n- 상체를 숙이고 엉덩이를 높인 상태에서 수행하면 전면 어깨(front delts)와 측면 어깨(lateral delts) 자극을 집중된 푸쉬업입니다.\n\n5. 디클라인 푸시업 (Decline Push-Up)\n- 벤치나 박스 위에 다리를 올리고 수행하면 가슴 상부(upper chest)와 전면 어깨(front delts)에 발달을 시킬 수 있는 푸시업입니다.\n\n#chestday #chest #pushup #chestworkout #homeworkout", "listed": true, "note": null, "guess": {"muscles": ["glutes", "chest", "shoulders", "triceps"], "types": [], "purposes": []}}, {"id": "DVKWuZRk3ZI", "url": "https://www.instagram.com/reel/DVKWuZRk3ZI/", "owner": "michellevlau", "time": "Mar 12, 2026 3:33 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "better warm up = better leg day ‼️\n\nthis 5 minute lower body warm up targets:\n\n✅ hip mobility\n✅ hamstring activation\n✅ ankle range of motion\n✅ lateral hip stability\n\nso your squats, hinges, and lunges feel smoother and stronger\n\nit’s dynamic movement prep designed to improve:\n\n• squat depth\n• hip rotation\n• glute engagement\n• ankle mobility\n• lower body stability\n\nsave this for your next leg day ✨\n\n#warmup #mobility #legday #strengthtrainingforwomen #bettherfitness", "listed": true, "note": null, "guess": {"muscles": ["hip flexors", "glutes", "quadriceps", "hamstrings"], "types": ["strength", "mobility", "stability"], "purposes": []}}, {"id": "DVqK74QkbWS", "url": "https://www.instagram.com/p/DVqK74QkbWS/", "owner": "seungwon5", "time": "Mar 12, 2026 1:03 am", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "6 Hip Mobility Exercises\n\nThese movements open the hips while improving mobility and stretching the inner thigh adductors.\nFree movement in the hips positively impacts the entire body, benefiting the lower back and knees.\n\n👇\n1. Kneel on one knee and extend the opposite leg out to the side.\nWith your pelvis tilted backward, shift your pelvis as far sideways as possible.\nIf you feel discomfort in your knee, adjust your foot placement so your knee doesn't extend past your toes.\nAs you move your pelvis and body sideways, be mindful not to let your knee collapse inward.\nYou should feel a strong stretch in the front of your hip joint and the inner thigh. This movement also helps with hip joint stiffness.\n\n2. Kneel on one knee and extend the opposite leg straight out to the side. Ensure the inner side of the foot is flat on the floor.\nFrom this position, push your pelvis back while simultaneously rotating your leg so the foot faces upward.\n\n3. While seated on the floor, extend one leg forward while simultaneously lifting your body upright. Push your knee forward as far as possible, allowing it to extend beyond your toes. Go only as far as comfortable without straining. Pause briefly, then repeat with the opposite leg.\n\n4. From the frog pose, push your pelvis back as far as possible. Be careful not to create excessive arch in your lower back; maintain spinal neutrality throughout. Return to the starting position and perform the internal rotation movement for both hips.\n\n5. From a quadruped position, open one hip and keep the leg extended to the side. From this position, gently arch your back as far as comfortably possible. This stretches the inner thighs and glutes while improving hip joint mobility.\n\n6. Place one knee on the ground and extend the opposite leg straight out to the side. From this position, gently rock your body back and forth.\n\nPerforming all 6 movements 8-10 times each is sufficient. However, if you wish to focus on specific movements, select 2-3 exercises and perform 2 sets of 10 repetitions each.\n\n-\n\n6가지 고관절 가동성 운동\n\n이 동작들은 고관절을 열어주는 동시에 가동성을 향상시키고 허벅지 안쪽 내전근을 스트레칭합니다.\n\n고관절의 자유로운 움직임은 몸의 위아래로 모두 좋은 영향을 줘서 허리, 무릎에도 도움이 됩니다.\n\n#hipmobility", "listed": true, "note": null, "guess": {"muscles": ["lower back", "hip flexors", "adductors", "glutes", "quadriceps"], "types": ["mobility", "stretch"], "purposes": ["lower back comfort", "knees"]}}, {"id": "DSYJ24kEYka", "url": "https://www.instagram.com/reel/DSYJ24kEYka/", "owner": "anyaturner98", "time": "Mar 11, 2026 11:22 pm", "collections": ["mobility"], "group": "fitness", "suggest": null, "caption": "I’ve had knee issues since I was 15.\nNow, 10+ years later, my knees feel stronger than ever and this is why \n\n✨ Strengt ive glutes and posterior chain\n\nHere’s how to address it properly:\n\n1️⃣ Hip Flexor Plank\nBuilds anterior chain strength and teaches the pelvis how to stay neutral under tension.\n\n2️⃣ Couch Stretch\nOpens the hip flexor, but only effective if ribs stay down and glutes stay active.\n\n3️⃣ Reverse Tabletop\nStrengthens the glutes and posterior chain to balance anterior dominance.\n\nHold each for 30 seconds.\nRun it 2–3 times per week.\nFocus on control, not just stretching.\n\nAPT isn’t corrected by hanging in positions.\nIt’s corrected by earning them.\n\nComment “PELVIS” if you want a structured lower-body mobility program.\n\nSave this and test it today.\n\n#anteriorpelvictilt\n#hipmobility\n#lowbackpain\n#posturecorrection\n#functionalstrength", "listed": true, "note": null, "guess": {"muscles": ["abdominals", "hip flexors", "glutes"], "types": ["mobility", "stretch", "stability"], "purposes": ["hip flexors / sitting stiffness", "desk breaks"]}}, {"id": "DTI1o6XgYb0", "url": "https://www.instagram.com/reel/DTI1o6XgYb0/", "owner": "rachel.lohhh", "time": "Mar 05, 2026 7:29 pm", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "enjoy the burn 🔥 \n\ni’ve been doing this ab routine 1-2x/week for the past few months. increase the weight you’re holding if it’s too easy!\n\nfull 25 min ab routine:\n- 40 crunches\n- 30 side crunches (each side)\n- 30 supine side crunches (each side)\n- 20 flutter kicks\n- 20 leg raise pulses\n- 20 tuck-ups\n- 5x20 pike-ups \n- 10 russian twists (arms extended)\n- 10 russian twist pulses (each side)\n- 10 unilateral bicycle crunches (each side)\n- 1 min plank\n- 30 sec side plank (each side)\n- 1 min hollow hold\n\n@gymshark graphic sports bra\n@lululemon:\n- hotty hot high rise shorts 2.5”\n- yoga mat\n\nas part of the #gymshark66 challenge, i stretched my abs for the first time in a while 😅 ab stretching routine coming soon!\n\n#abworkout #fitnessmotivation #abs #workout #athomeworkout #inspiration #six 극 차이 5가지🔽\n🔸5 Cable Triceps Variations – Grip Differences💥\n\n1. 기본 그립 프레스다운(Standard-Grip Pressdown)\n- 어깨너비로 눌러 삼두 전체(Triceps Overall)를 고르게 자극하며 초보자도 안정적으로 수행할 수 있는 가장 기본적인 프레스다운 동작입니다.\n\n2. 클로즈 그립 프레스다운(Close-Grip Pressdown)\n- 손 간격을 좁혀 눌러 삼두 외측두(Lateral Head)에 자극을 강해게 주며 팔 바깥 라인과 분리도를 강조하는 운동입니다.\n\n3. 리버스 그립 프레스다운(Reverse-Grip Pressdown)\n- 언더그립으로 눌러 삼두 내측두(Medial Head)에 자극을 주며 팔 안쪽 두께를 높이는 데 효과적입니다.\n\n4. 오버헤드 케이블 트라이셉스 익스텐션(Overhead Cable Triceps Extension)\n- 머리 위에서 밀어내어 삼두 장두(Long Head)를 깊게 자극해 팔 뒤쪽 길이감과 볼륨을 만드는 장두 집중 익스텐션 동작입니다.\n\n5. 로프 뉴트럴 그립 프레스다운(Rope Neutral-Grip Pressdown)\n- 로프를 벌리며 눌러 삼두 외측두(Lateral Head)와 전체 삼두에 강한 수축을 만들어 펌핑과 분리도가 좋은 변형 프레스다운입니다.\n\n📌 루틴 가이드\n• 10–15회/ 3–4세트/ 휴식 45–60초\n✔ 팔꿈치 고정\n✔ 손목 중립\n✔ 내려갈 때 1초 수축\n\n#arms #팔운동 #운동영상 #fitnesstip #헬린이", "listed": true, "note": null, "guess": {"muscles": ["shoulders", "triceps"], "types": ["strength"], "purposes": []}}, {"id": "DVBLvr-AWoP", "url": "https://www.instagram.com/p/DVBLvr-AWoP/", "owner": "jongkeungil", "time": "Feb 22, 2026 8:16 pm", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "🔽덤벨로 하는 초보자 하체 운동 5가지 루틴🔽\n🔸5 Best Dumbbell Leg Exercises for Beginners | Quad \u0026 Glute Routine\n\n1. 벤치 이용 덤벨 레그 컬(Dumbbell Leg Curl on Bench)\n- 벤치에 엎드린 상태에서 덤벨을 발로 고정해 햄스트링(Hamstrings)을 깊게 자극하며 하체 후면을 발달시키는 운동이다.\n\n2. 디피싯 내로우 덤벨 스쿼트(Deficit Narrow Dumbbell Squat)\n- 발을 좁게 두고 높이를 준 상태에서 앉아 일어나면 허벅지 앞쪽(Front Quads)에 자극을 주며 강한 하체 전면 스쿼트 운동이다.\n\n3. 기본 너비 고블릿 스쿼트(Standard Width Goblet Squat)\n- 어깨 너비로 덤벨을 들고 수행하여 하체 전체(Entire Quads)를 균형 있게 자극하며 초보자가 안전하게 스쿼트 패턴을 익히기 좋은 기본 스쿼트 운동이다.\n\n4. 덤벨 와이드 스쿼트(Dumbbell Wide Squat)\n- 발을 넓게 벌려 동작을 진행하면 내전근(Adductors)에 자극이 강하게 주며 하체 안쪽을 만드는 데 효과적인 운동이다.\n\n5. 덤벨 스티프 레그 데드리프트(Dumbbell Stiff-Leg Deadlift)\n- 무릎을 거의 구부리지 않고 엉덩이를 뒤로 빼서 내리면 햄스트링(Hamstrings)과 둔근(Glutes)을 깊게 늘려주고 수축하는 대표적인 후면 하체 힙힌지 운동이다.\n\n📌루틴 가이드\n• 3-4세트/ 12–15회\n• 휴식 60–90초\n• 추천 순서\n후면 활성(1) → 전면(2) → 전체(3) → 힙·내전(4) → 후면 힙힌지(5)\n\n#legs #legday #legworkout #quadworko : "Feb 16, 2026 3:05 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "Shoulder Exercise Variations (Cables Only!)\n\n• Cable Front Raise (Pronated Grip – palms down)\n→ Targets the front delts with some side-delt involvement\n\n• Cable Lateral Raise\n→ Primarily targets the side delts\n\n• Cable Y-Raise\n→ Targets the side delts and rear delts\n\n• Bent-Over Cable Rear Delt Fly\n→ Targets the rear delts, with minor side-delt activation\n\nSize \u0026 Shred Training program\n👉🏻 deltabolic.com (link in bio)", "listed": true, "note": null, "guess": {"muscles": ["chest", "shoulders"], "types": ["strength"], "purposes": []}}, {"id": "DTMtoj0kV-5", "url": "https://www.instagram.com/reel/DTMtoj0kV-5/", "owner": "davidpark_._", "time": "Feb 15, 2026 6:03 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "3 in 1 rep AB challenge🔥 \n\n1️⃣Knee Touches + Crunches x 10 reps\n2️⃣Rev. Crunches + V-up x 10 reps\n3️⃣Twist + Plank Push-up x 10 reps\n4️⃣Jackknife + Hold 3s x 10 reps\nRest 30-60s /exercise\n\nStart From Home: @davidpark_._ \n\n#startfromhome #9days #thechamps", "listed": true, "note": null, "guess": {"muscles": ["abdominals", "chest"], "types": ["stretch"], "purposes": ["knees"]}}, {"id": "DUoEI14jzvE", "url": "https://www.instagram.com/p/DUoEI14jzvE/", "owner": "mickmovements", "time": "Feb 14, 2026 10:58 pm", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "Dein unterer Rücken ist nicht schwach.\nEr ist überlastet.\n\nDie meisten Rückenschmerzen entstehen nicht durch „zu wenig Training“ –\nsondern durch steife Hüften, fehlende Rotation und zu wenig aktive Kontrolle.\n\nDiese 7 Übungen:\n\n– nehmen Druck vom unteren Rücken\n– mobilisieren deine Hüfte\n– verbessern deine Rotation\n– machen deine Wirbelsäule belastbar\n\n5 Minuten täglich reichen.\n\nNicht erst trainieren, wenn es weh tut.\nTrainiere, damit es nicht weh tut.\n\n💾 Speichern.\n💬 Kommentier RÜCKEN, wenn du meinen : "fitness", "suggest": null, "caption": "🔽바벨 컬 그립에 따른 4가지 자극 차이(Barbell Curl Grip Variations – 4 Types)🔽\n\n1.  클로즈 그립 스탠딩 바벨 컬(Close-Grip Standing Barbell Curl)\n- 이두근 외측(Biceps Outer Head)을 선명하게 자극하며, 좁은 그립으로 수행하면 팔 바깥 라인과 두께감을 강화하는 운동입니다.\n\n2. 와이드 그립 바벨 컬(Wide-Grip Barbell Curl)\n- 이두근 내측(Biceps Inner Head)을 더 강하게 자극하며, 넓은 그립으로 들어 올릴수록 팔 안쪽 볼륨과 피크를 키우는 데 효과적인 운동입니다.\n\n3. 기본 그립 스탠딩 바벨 컬(Standard-Grip Standing Barbell Curl)\n- 이두근 전체(Biceps Overall)를 고르게 자극하며, 어깨너비의 가장 안정적인 그립으로 초보자부터 숙련자까지 모두 사용하는 컬 운동입니다.\n\n4. 리버스 그립 스탠딩 바벨 컬(Reverse-Grip Standing Barbell Curl)\n- 상완근(Brachialis)과 요골근(Brachioradialis)을 강하게 자극하며, 언더그립·오버그립 반대로 잡아 팔 전완 라인과 두꺼운 팔 형태를 만드는 운동입니다.\n\n📌 루틴 가이드 (Workout Guide)\n- 각 운동 3세트 / 12-15회\n- 휴식 60초\n- 순서 추천: 내측 → 외측 → 전체 → 전완/상완근\n\n#bicepsworkout #arms #armday #fitnesslife #gymlife", "listed": true, "note": null, "guess": {"muscles": ["shoulders", "biceps"], "types": ["strength"], "purposes": []}}, {"id": "DTFlBqugZFB", "url": "https://www.instagram.com/p/DTFlBqugZFB/", "owner": "jongkeungil", "time": "Feb 03, 2026 2:17 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "🔽푸쉬업(Push up) 자극에 따른 5가지 운동 방법🔽\n🔸5 Push-Up Variations to Hit Chest, Triceps \u0026 Shoulders🔥\n\n1. 클로즈 뉴트럴 그립 푸쉬업 (Close Neutral-Grip Push-up)\n- 손을 좁게 두고 손목이 서로 마주보게 수행하면 삼두(Triceps)와 가슴 안쪽(Inner Chest)에 강한 자극이 들어갑니다. 팔꿈치가 몸통에 붙어 내려가 삼두 개입 비중이 가장 높은 푸쉬업 입니다.\n\n2. 기본 그립 푸쉬업 (Standard Push-up)\n- 어깨너비 손 위치에서 수행하면 가슴 전체(Entire Chest)에 고르게 자극되며 가슴 근육 전반을 균형 있게 발달시키는 가장 기본적인 푸쉬업입니다.\n\n3. 리버스 그립 푸쉬업 (Reverse-Grip Push-up)\n- 손바닥이 위를 향하도록 손을 뒤집어 수행하면 하부 가슴(Lower Chest)에 자극되며 어깨 부담은 줄이면서 가슴 하단을 보완하기 좋은 변형입니다.\n\n4. 디클라인 푸쉬업 (Decline Push-up)\n- 발을 벤치나 박스 위에 올려 상체가 아래로 기울어진 상태로 수행하면 상부 가슴(Upper Chest)과 전면 어깨(Front Delts)에 강한 자극이 들어갑니다. 일반 푸쉬업보다 난이도가 높습니다.\n\n5. 파이크 푸쉬업 (Pike Push-up)\n- 엉덩이를 높이 들어 상체를 수직에 가깝게 만들고 내려가면 삼각근 전몀(Anterior Delts)이 주동근으로 작용합니다. 체중으로 하는 숄더 프레스에 가장 가까운 푸쉬업입니다.\n\n#pushup #chest #chestworkout #헬린이 #fitness", "listed": true, "note": null, "guess": {"muscles": ["glutes", "chest", "shoulders", "triceps"], "types": [], "purposes": []}}, {"id": "DUJfx7MEi0U", "url": "https://www.instagram.com/reel/DUJfx7MEi0U/", "owner": "mentis.mvmt", "time": "Feb 03, 2026 12:55 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "Anterior pelvic tilt isn’t a stretching problem, it’s a control problem.\nThis drill teaches your hip flexors and core to actually work together, instead of dumping into your low back.\n\nStart with the static single-leg hip flexor plank.\nIf that’s easy, add controlled flexion and extension to increase the stability and strength demand.\n\nTrain this once a week and you’ll build better posture, a stronger hip-to-core connection, and movement that actually carries over to real life.\n\n👇 Save this and try it in your next lower-body or core session.\nComment “HIP” if you want a full progression or coaching cues.\n\n#anteriorpelvictilt #hipflexorstrength #movementquality #functionalstrength #trainforlongevity", "listed": false, "note": null, "guess": {"muscles": ["abdominals", "lower back", "hip flexors"], "types": ["stretch", "stability"], "purposes": ["hip flexors / sitting stiffness", "lower back comfort", "desk breaks"]}}, {"id": "DT5bruXjq7w", "url": "https://www.instagram.com/reel/DT5bruXjq7w/", "owner": "arielyu.fit", "time": "Feb 02, 2026 2:34 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "3-Minute Abs Workout at Home - Follow Along!\nReady to feel the burn?\n\n#abs #core #homeworkout #workouttips #fitnesstips", "listed": false, "note": "Same caption as DRhpVSqDooC (likely repost)", "guess": {"muscles": ["abdominals"], "types": ["conditioning"], "purposes": []}}, {"id": "DS13mAmk0Xb", "url": "https://www.instagram.com/reel/DS13mAmk0Xb/", "owner": "giljongkeun", "time": "Feb 02, 2026 2:31 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "🔽하체운동(Leg Day) 덤벨로 할 수 있는 하체 루틴 5가지🔽\n🔸Dumbbell Leg Routine – Lower Body Focus🔥\n\n1️⃣고블릿 스쿼트 (Goblet Squat)\n어깨너비로 앉아 대퇴사두(Quadriceps)를 고르게 자극합니다. 기본 하체 강화 운동입니다.\n\n2️⃣내로우 고블릿 스쿼트 (Narrow Goblet Squat)\n발을 좁게 두고 앉아 대퇴직근(Rectus Femoris)과 외측광근(Vastus Lateralis)을 선명하게 자극합니다.\n\n3️⃣와이드 고블릿 스쿼트 (Wide Goblet Squat)\n발을 넓게 두고 무릎을 벌리며 내전근(Adductors)과 허벅지 안쪽을 집중 자극합니다.\n\n4️⃣덤벨 스티프 레그 데드리프트 (Stiff-Leg Deadlift)\n무릎 고정, 엉덩이 접으며 햄스트링(Hamstrings)과 둔근(Glutes)을 깊게 스트레칭합니다.\n\n5️⃣스플릿 스쿼트 (Split Squat)\n앞다리에 체중을 싣고 내려가며 대퇴사두(Quads)와 둔근(Glutes)을 동시에 강화합니다.\n\n#하체운동 #운동영상 #릴스타그램 #reels #fitness", "listed": true, "note": null, "guess": {"muscles": ["adductors", "glutes", "quadriceps", "hamstrings", "middle back", "shoulders"], "types": ["strength", "stretch"], "purposes": []}}, {"id": "DTsLzAtAcr8", "url": "https://www.instagram.com/p/DTsLzAtAcr8/", "owner": "jongkeungil", "time": "Feb 01, 2026 7:26 pm", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "🔽원암 삼두 운동 루틴 4가지 (One-Arm Triceps Cable Workout – Beginner)🔽\n\n1. 원암 기본 그립 푸시다운 (One-Arm Standard Grip Pushdown)\n- 삼두 전체(Entire Triceps)를 고르게 자극하며, 한 팔을 사용하여 초보자도 삼두 수축을 더 정확하게 느낄 수 있는 가장 기본적인 원암 푸시다운 운동입니다.\n\n2. 원암 뉴트럴 그립 푸시다운 (One-Arm Neutral-Grip Pushdown)\n- 삼두 외측(Lateral Head)을 안정적으로 자극하며, 뉴트럴 손목 포지션을 사용하여 한쪽 삼두의 힘과 컨트롤을 자연스럽게 향상시키는 초보자용 원암 운동입니다.\n\n3. 원암 트라이셉스 라인 익스텐션 (One-Arm Triceps Line Extension)\n- 삼두 장두(Long Head)와 외측(Lateral Head)을 동시에 자극하며, 삼두 전체의 긴장감을 극대화하는 원암 익스텐션 운동입니다.\n\n4 원암 리버스 그립 푸시다운 (One-Arm Reverse-Grip Pushdown)\n- 삼두 내측(Medial Head)을 선명하게 자극하며, 언더그립을 사용해 팔꿈치 흔들림 없이 삼두 안쪽 섬유에 집중하기 좋은 고립 원암 운동입니다.\n\n📌 루틴 가이드 (Workout Guide)\n• 각 운동 3세트 / 10–15회\n• 휴식 60초\n• 운동순서: 전체 → 외측 → 장두 → 내측으로 마무리\n\n#tricepsworkout #arms #pushdown #cableworkout #armday", "listed": true, "note": null, "guess": {"muscles": ["triceps"], "types": ["strength"], "purposes": []}}, {"id": "DUJTeBeEfFR", "url": "https://www.instagram.com/reel/DUJTeBeEfFR/", "owner": "body_by_anna1", "time": "Feb 01, 2026 7:20 pm", "collections": ["Workouts"], "group" and real results.", "listed": true, "note": null, "guess": {"muscles": ["abdominals"], "types": ["stretch", "stability"], "purposes": ["desk breaks"]}}, {"id": "DUNqFwCgTBw", "url": "https://www.instagram.com/p/DUNqFwCgTBw/", "owner": "jongkeungil", "time": "Feb 01, 2026 11:32 am", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "🔽암컬 4가지 그립별 자극 차이 루틴(Biceps Curl – 4 Grip Variations)🔽\n\n1. 클로즈 그립 암컬(Close-Grip Biceps Curl)\n- 손을 좁게 잡아 올리면 이두 안쪽(Inner Biceps )에 자극이 집중되어 팔 안쪽 볼륨과 깊은 수축을 느끼기 좋은 변형이다.\n\n2. 와이드 그립 암컬(Wide-Grip Biceps Curl)\n- 손을 넓게 잡아 올리면 이두 바깥쪽(Outer Biceps)이 강하게 개입해 팔 바깥쪽 길이감과 피크를 강조하는 운동입니다.\n\n3. 뉴트럴 그립 암컬(Neutral-Grip Curl)\n- 손바닥이 마주보는 뉴트럴 그립으로 올리면 상완근(Brachialis)과 이두 바깥쪽(Long Head)이 자극이 커져 팔 두께감과 전체적인 전완 연결라인을 만드는 운동입니다.\n\n4. 리버스 그립 암컬(Reverse-Grip Biceps Curl)\n- 오버그립으로 들어 올리며 상완근(Brachialis)과 상완요골근(Brachioradialis)을 강하게 자극하는 동작으로, 전완과 팔 두께를 함께 강화하는 데 효과적인 변형 암컬 운동입니다.\n\n📌 루틴 가이드 (Routine Guide)\n• 각 운동 10–15회 × 3–4세트\n• 휴식 45–60초\n\n#bicepworkout #bicepscurl #armday #armworkout #reelsfitness", "listed": true, "note": null, "guess": {"muscles": ["biceps"], "types": ["strength"], "purposes": []}}, {"id": "DTXkR7oAe2s", "url": "https://www.instagram.com/p/DTXkR7oAe2s/", "owner": "jongkeungil", "time": "Jan 31, 2026 8:42 pm", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "🔽등 운동(Back Day) 그립별 자극 차이 5가지🔽\n🔸5 Lat Pulldown Grips That Change Your Back Shape🔥\n\n1. 언더그립 랫 풀다운 (Underhand Lat Pulldown)\n- 광배근 하부 하부 광배(Lower Lats)를 깊게 수축해 등 하단 폭을 만듭니다. 팔꿈치를 몸통에 붙여 당기면 하부 라인이 더 또렷해집니다.\n\n2. 와이드그립 랫 풀다운 (Wide-Grip Lat Pulldown)\n- 광배근 상부 상부 광배(Upper Lats)를 공략해 등 폭과 V테이퍼를 키웁니다. 팔 개입을 줄이고 등 바깥 라인에 집중됩니다.\n\n3. 클로즈그립 랫 풀다운 (Close-Grip Lat Pulldown)\n- 광배근 중·하부 중·하부 광배(Mid\u0026Lower Lats)를 집중 자극해 두께를 만듭니다. 등이 깊고 단단해 보이는 효과가 큽니다.\n\n4. 기본그립 랫 풀다운 (Standard-Grip Lat Pulldown)\n- 광배근 전체 광배 전체(Lats Overall)를 고르게 자극하는 가장 안정적인 그립입니다. 초보자부터 고중량 훈련까지 모두 적합합니다.\n\n5. 비하인드 랫 풀다운 (Behind-the-Neck Lat Pulldown)\n- 광배근 상부와 중부 등 그리고 중부 승모(Upper Lats \u0026 Mid Traps)를 강조합니다. 어깨 가동성이 충분할 때만 컨트롤해서 수행해주세요.\n\n📌간단 가이드\n• 3–4세트 / 8–12회\n• 휴식 60초\n\n#back #backday #등운동 #헬린이 #오운완", "listed": true, "note": null, "guess": {"muscles": ["lats", "shoulders", "neck"], "types": ["mobility"], "purposes": []}}, {"id": "DT-xJ-hk2z1", "url": "https://www.instagram.com/reel/DT-xJ-hk2z1/", "owner": "giljongkeun", "time": "Jan 31, 2026 8:27 pm", "collections": ["Workouts"], "group": "fitness", "suggest": null, "caption": "🔽등 운동(Back Workout) – 풀다운 그립별 자극 루틴 5가지 🔽\n\n1️⃣ 인클라인 벤치 풀다운 (Incline Bench Pulldown)\n- 벤치에 상체를 고정하고 당기면 광배근 하부(Lower Lats)에 집중 자극됩니다.\n\n2️⃣ 페이스 풀다운 (Face Pulldown)\n- 얼굴 쪽으로 당겨 후면 삼각근(Rear Delts)과 중·상부 승모근(Mid–Upper Traps)을 활성화합니다. \n\n3️⃣ 와이드 그립 풀다운 (Wide-Grip Pulldown)\n- 넓은 그립으로 광배근 상부(Upper Lats)와 외측 라인을 강조해 등 폭과 V테이퍼를 키웁니다.\n\n4️⃣ V-바 풀다운 (V-Bar Pulldown)\n- 손을 몸 가까이 유지하며 당겨 광배근 중간(Mid Lats)을 수축시키고 등 두께를 강화합니다.\n\n5️⃣ 비하인드 넥 풀다운 (Behind-the-Neck Pulldown)\n- 머리 뒤로 당겨 광배근 상부(Upper Lats)와 중부 승모근(Mid Traps)을 자극합니다.\n\n📌 루틴 가이드\n• 각 3–4세트 / 10–12회\n• 세트 간 휴식 60초\n\n#pulldown #backworkout #latworkout #오운완 #헬린이", "listed": true, "note": null, "guess": {"muscles": ["lats", "middle back", "shoulders", "neck"], "types": [], "purposes": []}}, {"id": "DUBDnesDiYq", "url": "https://www.instagram.com/p/DUBDnesDiYq/", "owner": "thefitcircuits", "time": "Jan 31, 2026 8:25 pm", "collections": [], "group": "fitness", "suggest": null, "caption": "15 Minute Abs — No Weights! 🔥\n(Save \u0026 Try) 💪🏻\n-\nWorkouts:\n20 Alternating Knee In\n15 Seated Leg Lift\n20 Alternating Leg Clap\n20 Alternating Leg Lift\n30 Heel Tap\n20 Elbow to Knee Crunch\n-\nRepeat as a Circuit for 15 Minutes Straight 🔁\n-\nFREE training guide in my bio 🔗", "listed": true, "note": null, "guess": {"muscles": ["abdominals"], "types": ["strength", "conditioning"], "purposes": ["knees"]}}, {"id": "DT06ZkXEk7i", "url": "https://www.instagram.com/reel/DT06ZkXEk7i/", "owner": "alejandromatiasfit", "time": "Jan 30, 2026 7:17 pm", "collections": [], "group": "fitness", "suggest": null, "caption": "You do not need an hour to train mobility.\nTen minutes is enough if your consistent.\n\nWorld’s greatest stretch\n6 reps per side. This opens the hip flexors and adds rotation at the same time. Dynamic mobility like this tends to improve usable range of motion more than just holding a stretch.\n\nUp dog to down dog\nAbout 10 slow reps. Up dog opens the front of the body. Down dog lengthens the back side. Moving between the two helps keep the spine and shoulders moving instead of stiffening up.\n\nHalf kneeling rotations\n6 to 8 reps per side. This trains thoracic rotation, which takes stress off your low back and shoulders.\n\nCossack hovers\nSlow and controlled. You are building strength and mobility in the inner thighs, glutes, and hamstrings at the same time.\n\n90 90 with a forward fold\n5 reps per side. This improves hip external rotation and control at end range.", "listed": false, "note": null, "guess": {"muscles": ["lower back", "hip flexors", "adductors", "glutes", "hamstrings", "shoulders", "thoracic spine"], "types": ["mobility", "stretch", "stability"], "purposes": ["hip flexors / sitting stiffness", "lower back comfort"]}}, {"id": "DSWK_WkkXC6", "url": "https://www.instagram.com/reel/DSWK_WkkXC6/", "owner": "sweat_squadusa", "time": "Jan 30, 2026 7:12 pm", "collections": [], "group": "fitness", "suggest": null, "caption": "No Running, No Jumping—Total Body Home Workout with One Kettlebell! #womensfitness #sports #forecast #exercise #bodybuilding #girls #homeworkout #abs #fitnese #workout", "listed": false, "note": null, "guess": {"muscles": ["abdominals"], "types": ["strength"], "purposes": []}}, {"id": "DTqlYYjklza", "url": "https://www.instagram.com/reel/DTqlYYjklza/", "owner": "trevorsinstinct", "time": "Jan 30, 2026 7:02 pm", "collections": [], "group": "fitness", "suggest": null, "caption": "Do this while you watch TV.\n10 minutes is all you need.\n\nYou don’t need the 90-minute yoga class.\n(Not that those aren’t amazing for you.)\n\nBut a consistent 10 minutes a night will go much farther than a few yoga classes a month.\n\nLike Bruce Lee said, “One kick a day.”\n\nWe should all be stretching at least 10 minutes a day.\n\nIt’s not about getting flexible.\n\nIt’s about restoring and maintaining your basic human movement — or else you will inevitably lose it in modern times, leading to pain, bad posture, immobility, poor sleep, and a less-than-ideal version of yourself.\n\nSo do this:\n\t1.\tForward fold — 2 min\n\t2.\tLizard — 1 min each side\n\t3.\t90/90 — 1 min each side\n\t4.\tSphinx — 2 min\n\t5.\tTwist — 1 min each side\n\nDo this tonight and tell me you don’t feel amazing (and ready for bed).\n\n#mobility #stretching #yoga", "listed": true, "note": null, "guess": {"muscles": ["hip flexors"], "types": ["mobility", "stretch"], "purposes": ["desk breaks"]}}, {"id": "DRhpVSqDooC", "url": "https://www.instagram.com/reel/DRhpVSqDooC/", "owner": "arielyu.fit", "time": "Jan 29, 2026 10:08 pm", "collections": [], "group": "fitness", "suggest": null, "caption": "3-Minute Abs Workout at Home - Follow Along!\n\nReady to feel the burn?\n\n#abs #core #homeworkout", "listed": false, "note": "Same caption as DT5bruXjq7w (likely repost)", "guess": {"muscles": ["abdominals"], "types": ["conditioning"], "purposes": []}}, {"id": "DTid_ORCQ8_", "url": "https://www.instagram.com/reel/DTid_ORCQ8_/", "owner": "trevorsinstinct", "time": "Jan 29, 2026 9:51 am", "collections": [], "group": "fitness", "suggest": null, "caption": "Five minutes a day will literally reverse your age. \n\nHere’s the flow you see on screen:\n\n• Pump stretch – full-body opener. Hamstrings, spine, shoulders, wrists, hands. Wakes everything up.\n• Lizard reaches – deep into the hips, psoas, and cross-body lines. This is huge for back pain.\n• Deep squat twists – ankles, hips, thoracic spine, neck. This is posture medicine.\n• Crab pulses – shoulders, chest, core, glutes, wrists. Counteracts sitting.\n• Windshield wipers – spinal reset. Twist the junk out.\n\nDo this every day and you will move better, feel better, and look younger. Period.\n\n#mobility #mobilitytraining #yoga", "listed": true, "note": null, "guess": {"muscles": ["abdominals", "lower back", "hip flexors", "glutes", "quadriceps", "hamstrings", "chest", "shoulders", "forearms", "neck", "thoracic spine"], "types": ["strength", "mobility", "stretch"], "purposes": ["hip flexors / sitting stiffness", "lower back comfort", "desk breaks", "wrists"]}}, {"id": "DUDnAMtDHNw", "url": "https://www.instagram.com/p/DUDnAMtDHNw/", "owner": "tomwilsonleonard", "time": "Jan 28, 2026 7:53 am", "collections": [], "group": "fitness", "suggest": null, "caption": "If I had 10 minutes for morning mobility, I’d start here.\n\nThis sequence moves through lateral lines, rotation, deep hip flexion, posterior chain activation, and finishes by opening the front of the body.\n\nIt’s designed to restore joint range, re-engage the back line, and take the spine through flexion, extension, and rotation, without forcing anything.\n\nHalf Kneeling Lateral Chain Flow\nCreates space through the side body, hips, and ribs. Helps restore lateral flexion and breathing capacity early on.\n\nSquat Reach Twist\nCombines deep hip flexion with thoracic rotation. Encourages ankle, hip, and upper-back mobility in one grounded shape.\n\nSquat to Forward Fold\nTransitions from load to release. Allows the spine to flex and decompress while the hamstrings lengthen naturally.\n\nProne Posterior Chain Activation\nRe-engages glutes and spinal extensors. Helps create support so mobility doesn’t turn into collapse.\n\nWorld’s Greatest Stretch\nIntegrates hips, spine, and shoulders. A controlled way to move through extension and rotation together.\n\nRunner’s Lunge / Extended Pyramid\nLengthens the hamstrings and calves while maintaining pelvic control and stability.\n\nHip Flexion Lifts\nBuilds active hip flexion strength and control at end range. Encourages the hip flexors to work without gripping and supports better mechanics for walking, running, and daily movement.\n\nQuadruped Hip Flow\nExplores hip rotation and control close to the ground. Less stretch, more awareness.\n\n90–90 Internal Rotation\nTargets internal hip rotation - a range many people lose with prolonged sitting and training bias.\n\nProne Chest Stretch\nOpens the chest and shoulders after posterior-chain work. Encourages thoracic extension and helps the nervous system settle before the day begins.\n\nIf you want follow-along mobility like this, the full 10-minute program is linked in my bio.", "listed": false, "note": null, "guess": {"muscles": ["hip flexors", "glutes", "quadriceps", "hamstrings", "calves", "chest", "shoulders", "thoracic spine"], "types": ["strength", "mobility", "stretch", "stability"], "purposes": ["hip flexors / sitting stiffness"]}}, {"id": "DThmJFEiJJE", "url": "https://www.instagram.com/reel/DThmJFEiJJE/", "owner": "les_bodcon", "time": "Jan 28, 2026 4:18 am", "collections": [], "group": "fitness", "suggest": null, "caption": "Exercises for a healthy spine. \n\nShare with a friend who’s joints need a bit of WD40 🧴🛢️", "listed": false, "note": null, "guess": {"muscles": [], "types": [], "purposes": []}}, {"id": "DT2eT7kkTaG", "url": "https://www.instagram.com/p/DT2eT7kkTaG/", "owner": "jongkeungil", "time": "Jan 26, 2026 8:54 am", "collections": [], "group": "fitness", "suggest": null, "caption": "🔽가슴 운동 루틴 5가지 (Beginner Chest Workout – Dumbbell \u0026 Barbell Only)🔽\n\n1. 뉴트럴 그립 덤벨 프레스(Neutral-Grip Dumbbell Press)\n- 가슴 내측(Inner Chest)과 안쪽 라인과 삼두(Triceps)를 안정적으로 자극하며, 그립의 특성으로 팔꿈치 부담을 줄이면서 가슴 안쪽을 자극시키는 운동입니다.\n\n2. 디클라인 덤벨 풀오버(Decline Dumbbell Pullover)\n- 가슴 하부(Lower Chest)를 깊게 스트레치해 하부 라인을 강하게 자극하며, 가슴을 아래 방향으로 확장시키는 데 초보자에게 가장 안전하고 효과적인 운동입니다.\n\n3. 리버스 그립 덤벨 프레스(Reverse-Grip Dumbbell Press)\n- 가슴 상부(Upper Chest)와 쇄골라인을 선명하게 자극하며, 리버스 그립 특성으로 상부 가슴의 자극을 느끼기 좋은 프레스 운동입니다.\n\n4. 플랫 덤벨 프레스 (Flat Dumbbell Press)\n- 가슴 전체(Entire Chest)를 고르게 자극하며, 중부를 중심으로 상·하부까지 균형 잡힌 발달을 돕는 초보자 필수 운동입니다.\n\n5. 인클라인 로우 덤벨 프레스 (Incline Low Dumbbell Press)\n- 가슴 상부(Upper Chest)와 중부(Mid Chest)를 자연스러운 낮은 각도로 자극하며, 덤벨로 넓은 가동범위를 사용해 상부 라인을 자극시키는 운동입니다.\n\n📌 루틴 가이드 (Workout Guide)\n• 각 운동 3–4세트 / 12-15회\n• 휴식 60초\n\n#chestworkout #beginnerchest #chest #chestday #fitnessroutine", "listed": true, "note": null, "guess": {"muscles": ["chest", "lats", "middle back", "triceps"], "types": ["strength"], "purposes": []}}, {"id": "DSSS2V7DzGs", "url": "https://www.instagram.com/reel/DSSS2V7DzGs/", "owner": "coachkeg", "time": "Jan 25, 2026 7:20 am", "collections": [], "group": "fitness", "suggest": null, "caption": "This isn’t just a “balance exercise.”\nThis is strength, stability, and control all on one leg.\n\nSingle-leg RDLs train:\n• Posterior chain strength (glutes + hamstrings)\n• Hip stability \u0026 control\n• Balance and body awareness\n• Reduced side-to-side imbalances\n\nMost sport movements happen off one leg.\nIf you can’t control force on one side, it shows up in speed, power, and injury risk.\n\nSlow it down.\nOwn the hinge.\nStay square through the hips.\n\nBuild strength that actually carries over.\n\nBe Great Today.\nTrain with me → link in bio. 💪🏻\n\n#singlelegexercises #athletetraining #femaleathletes #performancetraining", "listed": true, "note": null, "guess": {"muscles": ["hip flexors", "glutes", "hamstrings"], "types": ["stability"], "purposes": []}}, {"id": "DTTNk-zkVuT", "url": "https://www.instagram.com/reel/DTTNk-zkVuT/", "owner": "coachjohnnoel", "time": "Jan 22, 2026 7:31 pm", "collections": [], "group": "fitness", "suggest": null, "caption": "Welcome back to “anyone can do this”\n\nA series where I show you viral workout videos and provide modifications so that anyone can do them.\n\nMake sure to follow me for more content making health and fitness accessible to everyone. \n\nOP: @tailoredfitpt \n\nShorts: @raskolapparel: code jnoel \nShoes: @vivobarefoot motus flex ": null, "guess": {"muscles": ["hip flexors"], "types": ["stretch"], "purposes": ["knees"]}}, {"id": "DTaH5yega2b", "url": "https://www.instagram.com/p/DTaH5yega2b/", "owner": "jongkeungil", "time": "Jan 21, 2026 1:46 am", "collections": [], "group": "fitness", "suggest": null, "caption": "초보자들이 쉽게 할 수 있는 어깨 루틴 5가지🔽\n🔸5 Easy Shoulder Exercises for Beginners🔥\n\n1. 시티드 덤벨 사이드 래터럴 레이즈(Seated Dumbbell Side Lateral Raise)\n- 앉은 상태에서 팔을 옆으로 들어 올려 측면 삼각근(Lateral Delts)을 고립 자극합니다. 반동을 최소한 줄여서 초보자도 어깨 폭을 안전하게 키우기 좋은 동작입니다.\n\n2. 시티드 오버헤드 덤벨 프레스(Seated Overhead Dumbbell Press)\n- 앉은 상태에서 덤벨을 머리 위로 밀어 올리며 전면·측면 삼각근(Front \u0026 Lateral Delts)을 동시에 강화합니다. 앉아서 수행해 허리 부담이 적고 안정성이 높습니다.\n\n3. 시티드 덤벨 프론트 레이즈(Seated Dumbbell Front Raise)\n- 벤치에 앉아 양 팔을 앞으로 들어 올려 전면 삼각근(Front Delts)을 집중 공략합니다. 프레스 동작이 어려운 초보자에게 좋은 보조 운동입니다.\n\n4. 시티드 벤트오버 래터럴 레이즈(Seated Bent-Over Lateral Raise)\n- 상체를 숙여 팔을 벌리며 후면 삼각근(Rear Delts)을 자극합니다. 어깨 불균형 예방과 자세 개선에 필수적인 동작입니다.\n\n5. 시티드 아놀드 프레스(Seated Arnold Press)\n- 덤벨을 회전시키며 밀어 올려 전면·측면 삼각근(Front \u0026 Lateral Delts)을 넓게 자극합니다. 마무리 운동으로 어깨 전체 볼륨과 펌핑을 극대화하기 좋습니다.\n\n📌 초보자 루틴 가이드\n• 각 3세트 / 10–15회\n• 휴식 60초\n\n#shoulderworkout #workoutroutine #shoulders #운동영상 #gymtips", "listed": true, "note": null, "guess": {"muscles": ["lower back", "chest", "shoulders"], "types": ["strength"], "purposes": ["lower back comfort"]}}, {"id": "DTYB5u9jErM", "url": "https://www.instagram.com/p/DTYB5u9jErM/", "owner": "tomwilsonleonard", "time": "Jan 15, 2026 8:24 am", "collections": [], "group": "fitness", "suggest": null, "caption": "If your neck and shoulders feel tight, start here.\n\nNeck and shoulder stiffness is rarely isolated to one structure.\n\nIt’s often influenced by how the shoulder joint, scapula, and upper thoracic spine are moving, or not moving, together.\n\nThis sequence focuses on restoring controlled movement through the shoulders and neck, rather than forcing stretch.\n\nThe sequence:\n\n1. Shoulder Taps\nIntroduces gentle load through the shoulders while adding rotation, helping reintroduce joint awareness and control.\n\n2. Shoulder-Focused Puppy Pose\nEncourages shoulder flexion and thoracic extension while keeping the neck unloaded.\n\n3. Neck Flexion–Extension Flow\nSupporting the head reduces unnecessary neck tension, allowing flexion and extension without strain.\n\n4. Straight Arm Scapular Rolls\nImproves scapular protraction and retraction so the neck doesn’t compensate for restricted shoulder blade movement.\n\n5. Kneeling Lateral Neck Release\nAddresses side-neck tension while the shoulders remain relaxed and supported.\n\n6. Prone Swimmers\nRestores controlled internal and external rotation of the shoulders, which is essential for healthy shoulder mechanics.\n\n7. Prone Shoulder Stretch\nTargets anterior shoulder tissues that often become restricted from prolonged sitting or training.\n\n8. Shoulder Extension Rock-Back\nLoads shoulder extension in a supported position, helping the joint tolerate movement behind the body.\n\n9. Hinged Shoulder Extension Fold\nIntegrates shoulder extension into a standing hinge, combining mobility with control.\n\nMove slowly. Stay within a range you can control.\nThe goal is smoother movement, not forcing flexibility.\n\nFree full mobility flow in the link in my bio.", "listed": true, "note": null, "guess": {"muscles": ["middle back", "shoulders", "neck", "thoracic spine"], "types": ["mobility", "stretch", "stability"], "purposes": []}}, {"id": "DRvOl0SgRcc", "url": "https://www.instagram.com/reel/DRvOl0SgRcc/", "owner": "yogasong_hayeon", "time": "Jan 07, 2026 12:48 am", "collections": [], "group": "fitness", "suggest": null, "caption": "Do these 7 before bed → you’ll sleep like a baby 😮‍💨\n\nTight back at night? Trouble sleeping? 💤 \nThese are my top 7 bedtime stretches I’ve been doing and teaching for 15+ years.\nGive yourself 5 minutes to release the tension you’ve been carrying all day. Your sleep will feel different tonight 🤍\n\n#lowerbackrelief #bedtimestretch #stre
