* Add the onion and cook until softened and lightly golden.\n* Add the cream and milk, then stir in all the seasonings.\n* Cook for 2–3 minutes over medium heat.\n* Add the Parmesan and mix until smooth and creamy.\n\nParmesan Fries\n\n* Toss the fries with Parmesan, cayenne, garlic powder and a little salt.\n\nAssemble\n\n* Spread about 2 tbsp of garlic Parmesan sauce over a tortilla.\n* Add Parmesan fries and sliced chicken.\n* Top with mozzarella and Parmesan.\n* Fold tightly into a wrap.\n\nCrisp the Wrap\n\n* Heat 1–2 tbsp oil in a pan over medium-low heat.\n* Cook the wrap for about 2 minutes on each side, until golden and crispy.\n* Serve with Parmesan sauce and fries.\n\nEnjoy! 🤍\n#dinnerideas #chickenwrap #easyrecipes #wrap #easyrecipes", "listed": false, "note": null, "guess": {"muscles": [], "types": [], "purposes": []}}, {"id": "DdSjdMDvVAK", "url": "https://www.instagram.com/reel/DdSjdMDvVAK/", "owner": "dalenasbites", "time": "Oct 03, 2026 6:36 am", "collections": ["food"], "group": "other", "suggest": "discard", "caption": "MINIMAL EFFORT, BIG FLAVOR 🤤\n\nif you’ve never made Thai basil chicken at home, this is your sign!\nit’s so simple yet packed with flavor- sooo good with rice \u0026 a fried egg.. you’ll def have this one on rotation👌🏼\n\nthe app link for Prepist is in my bio, or you can search ‘Prepist: recipes \u0026 meal prep’ directly in the App Store! ❤️\n\n👉 comment “chicken” and I’ll send you the full recipe! \n\n#thaibasilchicken #chickenrecipe #easydinners #weeknightdinner #quickrecipe", "listed": false, "note": null, "guess": {"muscles": [], "types": [], "purposes": []}}, {"id": "Dd9pc1AyUC4", "url": "https://www.instagram.com/reel/Dd9pc1AyUC4/", "owner": "iramsfoodstory", "time": "Oct 02, 2026 3:49 am", "collections": ["food"], "group": "other", "suggest": "discard", "caption": "Hot Honey Garlic Chicken Bread 🥖 🍯 \n\nIngredients\n\nFor the Chicken\n1 lb boneless, skinless chicken breast, cut into small bite-size pieces\n1 tbsp olive oil\n1 tsp garlic powder\n1 tsp onion powder\n1 tsp smoked paprika\n1/2 tsp chili powder\n1/2 tsp black pepper\nSalt to taste\n1 tsp cornstarch\n\nFor the Hot Honey\n1/3 cup honey\n2 tbsp hot sauce\n1/2 tsp red pepper flakes\n1/2 tsp smoked paprika\n1 tsp butter\n1 tsp lemon juice\nPinch of salt\n\nFor the Garlic Butter\n4 tbsp salted butter, softened\n1 tbsp fresh garlic, finely minced\n1 tbsp fresh parsley, finely chopped\n1/2 tsp garlic powder\n1/4 tsp salt\n1 tbsp grated Parmesan\n\nFor the Garlic Bread\n\n1 large French or Italian loaf\n2 cups shredded mozzarella\n1/4 cup grated Parmesan\nFresh parsley, for garnish\n\nFor the Hot Honey Garlic Aioli\n1/2 cup mayonnaise\n2 tbsp hot honey\n1 small garlic clove, finely grated\n1 tsp lemon juice\n1/4 tsp smoked paprika\nPinch of salt\n\nInstructions\nAdd honey, hot sauce, red pepper flakes, smoked paprika, butter, lemon juice, and salt to a small saucepan. Heat over low heat for 1–2 minutes, stirring until combined and glossy. Set aside.\n Add chicken, oil, garlic powder, onion powder, smoked paprika, chili powder, black pepper, salt, and cornstarch to a bowl. Toss to coat.\nHeat a large skillet over medium-high heat. Add a little oil and cook chicken for 5–7 minutes, stirring occasionally, until browned and cooked through.\n Mix softened butter, garlic, parsley, garlic powder, salt, and Parmesan until combined.\n Mix mayonnaise, hot honey, garlic, lemon juice, smoked paprika, and salt until smooth. Refrigerate until ready to serve. Preheat oven to 375°F. Slice the loaf in half lengthwise and spread generously with garlic butter.\nTop with half the mozzarella, hot honey chicken, remaining mozzarella, and Parmesan.\nBake for 10–15 minutes, until the cheese is melted and bubbly and the edges are golden. Broil for 1–2 minutes if desired, watching closely.\nRemove from the oven and drizzle generously with the remaining hot honey. Garnish with fresh parsley and Parmesan.\nSlice and serve warm with the hot honey garlic aioli for dipping. \n#recipe #garlicbread #hothoneychicken", "listed": false, "note": null, "guess": {"muscles": [], "types": [], "purposes": []}}, {"id": "DdmJgAnNJFB", "url": "https://www.instagram.com/reel/DdmJgAnNJFB/", "owner": "ayline.ea", "time": "Sep 22, 2026 8:27 pm", "collections": ["food"], "group": "other", "suggest": "discard", "caption": "Doner Kebab\n\nJuicy homemade doner kebab served with roasted veggies, fresh onion salad, and a creamy garlic tzatziki sauce 🙂‍↕️\n\nIngredients:\n\t•\tTaco bread (20–25 cm)\n\nFor the tomato sauce:\n\t•\t3 tomatoes\n\t•\t3–4 garlic cloves, minced\n\t•\tChopped parsley\n\t•\t1 tsp chili powder (optional)\n\t•\t1 tsp chili flakes (optional)\n\t•\t1 tbsp paprika\n\t•\t1/2 tsp salt\n\t•\t1/2 tsp black pepper\n\nFor the meat:\n\t•\t500 g ground beef\n\t•\t2 tbsp yogurt\nSeasoning:\n\t•\t2 tbsp paprika\n\t•\t1 tbsp ground cumin\n\t•\t1 tbsp ground black pepper\n\t•\t1 tsp chili flakes\n\t•\t1 tsp ground coriander\n\t•\t1 tsp dried oregano or thyme\n\t•\t1 tsp ground allspice\n\t•\t1 tsp onion powder\n\t•\t1/2 tsp cinnamon (optional)\n\t•\t1/2 tsp nutmeg (optional)\n\t•\t1/2 tsp ground cardamom (optional)\n\t•\t2 tsp salt\n\t•\t3 garlic cloves, minced\n\nVegetables for roasting:\n\t•\t1 large tomato\n\t•\t1 onion\n\t•\tJalapeño pepper\n\t•\tOlive oil\n\t•\tSalt and pepper to taste\n\nFor the onion salad\n\t•\t1 medium onion (white or red)\n\t•\t1 large bunch fresh parsley, finely chopped\n\t•\t1–2 tbsp sumac\n\t•\t2 tbsp lemon juice\n\t•\t2 tbsp olive oil\n\t•\tSalt to taste\n\t•\tOptional: pinch of chili flakes\n\nFor the garlic tzatziki sauce:\n\t•\t3 tbsp mayonnaise\n\t•\t1/2 large cucumber, grated\n\t•\t2 tbsp yogurt\n\t•\t3–4 garlic cloves, finely grated\n\t•\t1 tbsp lemon juice\n\t•\t2 tbsp olive oil\n\t•\tSalt to taste\n\t•\t1/2 tsp black pepper\n\t•\tHerbs (optional)\n\nOptional side\n\t•\tFries, fried in avocado oil\n\nInstructions\n\n1.\tCook tomatoes with a little oil, covered, until skins crack. Peel, mash, and mix w <script>// Pure logic for review.html: store shape, v1 migration, import/export, purpose matching.
// No DOM access here, so it runs in the browser (inlined) and under `node --test`.
(function (root) {
  'use strict';

  const DIMS = ['muscles', 'types', 'purposes'];
  const STARTER_PURPOSES = ['hip flexors / sitting stiffness', 'lower back comfort', 'desk breaks', 'wrists', 'knees', 'shoulder health'];

  // v1 tag -> v2 values. Anything not listed (and not a known role) is a custom tag -> purpose.
  const V1_MUSCLES = {
    'core': ['abdominals'], 'lower back': ['lower back'], 'hips': ['hip flexors'], 'glutes': ['glutes'],
    'legs': ['quadriceps', 'hamstrings'], 'chest': ['chest'], 'upper back': ['middle back', 'lats'],
    'shoulders': ['shoulders'], 'biceps': ['biceps'], 'triceps': ['triceps'], 'forearms': ['forearms'],
  };
  const V1_TO_DESK = new Set(['posture', 'desk reset']);
  const V1_DROPPED_ROLES = new Set(['warm-up', 'cool-down', 'gym', 'home', 'finisher']);

  const uniq = list => [...new Set(list)];
  const norm = s => String(s).trim().toLowerCase().replace(/\s+/g, ' ');

  function emptyStore() {
    return {
      version: 2, decisions: {}, notes: {}, moves: {},
      tags: { muscles: {}, types: {}, purposes: {} },
      extraPurposes: [], importedIds: [],
      group: 'fitness', status: 'all', embed: true, cur: null,
    };
  }

  // Split a list of v1 tags into v2 dimensions.
  function mapV1Tags(list) {
    const muscles = [], purposes = [];
    for (const t of list || []) {
      if (V1_MUSCLES[t]) muscles.push(...V1_MUSCLES[t]);
      else if (V1_TO_DESK.has(t)) purposes.push('desk breaks');
      else if (!V1_DROPPED_ROLES.has(t)) purposes.push(t);
    }
    return { muscles: uniq(muscles), purposes: uniq(purposes) };
  }

  function migrateV1(old) {
    const s = emptyStore();
    for (const k of ['decisions', 'notes', 'moves']) s[k] = { ...(old[k] || {}) };
    for (const k of ['group', 'status', 'embed', 'cur']) if (k in old) s[k] = old[k];
    for (const [id, list] of Object.entries(old.tags || {})) {
      const m = mapV1Tags(list);
      if (m.muscles.length) s.tags.muscles[id] = m.muscles;
      if (m.purposes.length) s.tags.purposes[id] = m.purposes;
    }
    s.extraPurposes = uniq((old.custom || []).filter(t => !STARTER_PURPOSES.includes(t)));
    return s;
  }

  function tagsOf(item, store, dim) {
    const own = store.tags[dim][item.id];
    return own ? { values: own, confirmed: true } : { values: (item.guess && item.guess[dim]) || [], confirmed: false };
  }

  function matchPurpose(query, list) {
    const q = norm(query);
    if (!q) return { exact: null, matches: [...list] };
    return { exact: list.find(v => norm(v) === q) || null, matches: list.filter(v => norm(v).includes(q)) };
  }

  const NOT_EXPORT = () => new Error('Not a review export');

  const DECISIONS = new Set(['keep', 'discard', 'undecided']);
  const isStr = v => typeof v === 'string';
  const isStrList = v => Array.isArray(v) && v.every(isStr);
  const optional = (v, check) => v === undefined || v === null || check(v);

  // Every field the merge reads must have the right type, or the whole file is rejected,
  // so a bad file can never be written into saved progress.
  function validRecord(r) {
    return r && isStr(r.id)
      && optional(r.decision, v => DECISIONS.has(v))
      && optional(r.moves, isStr) && optional(r.note, isStr)
      && optional(r.tags, isStrList)
      && DIMS.every(d => optional(r[d], isStrList));
  }

  // Accepts the v2 object export and the earlier v1 plain-array export.
  function parseImport(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { throw NOT_EXPORT(); }
    const isRecords = a => Array.isArray(a) && a.every(validRecord);
    if (isRecords(data)) {
      const records = data.map(r => {
        // v1 exported guesses too; only tags the owner confirmed count as confirmed.
        const m = r.tagsConfirmed === true ? mapV1Tags(r.tags) : { muscles: [], purposes: [] };
        return {
          id: r.id, decision: r.decision, moves: r.moves || '', note: r.note || '',
          muscles: m.muscles, musclesConfirmed: m.muscles.length > 0,
          types: [], typesConfirmed: false,
          purposes: m.purposes, purposesConfirmed: m.purposes.length > 0,
        };
      });
      return { records, purposes: [] };
    }
    if (data && data.version === 2 && isRecords(data.records)) {
      const purposes = data.vocab && data.vocab.purposes;
      if (!optional(purposes, isStrList)) throw NOT_EXPORT();
      return { records: data.records, purposes: purposes || [] };
    }
    throw NOT_EXPORT();
  }

  // Local work wins; imported values only fill what is empty locally.
  function mergeImport(store, parsed) {
    const s = JSON.parse(JSON.stringify(store));
    for (const r of parsed.records) {
      if (r.decision && r.decision !== 'undecided' && !s.decisions[r.id]) s.decisions[r.id] = r.decision;
      if (r.moves && !s.moves[r.id]) s.moves[r.id] = r.moves;
      if (r.note && !s.notes[r.id]) s.notes[r.id] = r.note;
      for (const dim of DIMS) {
        if (r[dim + 'Confirmed'] && Array.isArray(r[dim]) && !(r.id in s.tags[dim])) s.tags[dim][r.id] = [...r[dim]];
      }
      if (!s.importedIds.includes(r.id)) s.importedIds.push(r.id);
    }
    const imported = [...parsed.purposes, ...parsed.records.flatMap(r => (r.purposesConfirmed && r.purposes) || [])];
    s.extraPurposes = uniq([...s.extraPurposes, ...imported.filter(p => !STARTER_PURPOSES.includes(p))]);
    return s;
  }

  function exportRecords(items, store, vocab) {
    const records = items.map(i => {
      const r = {
        id: i.id, url: i.url, owner: i.owner, collections: i.collections,
        decision: store.decisions[i.id] || 'undecided',
      };
      for (const dim of DIMS) {
        const t = tagsOf(i, store, dim);
        r[dim] = [...t.values];
        r[dim + 'Confirmed'] = t.confirmed;
      }
      Object.assign(r, {
        captionListsMoves: !!i.listed, moves: store.moves[i.id] || '', note: store.notes[i.id] || '', caption: i.caption,
      });
      return r;
    });
    return {
      version: 2, exportedAt: new Date().toISOString(),
      vocab: { muscles: vocab.muscles, types: vocab.types, purposes: uniq([...vocab.purposes, ...store.extraPurposes]) },
      records,
    };
  }

  const api = { DIMS, emptyStore, migrateV1, tagsOf, matchPurpose, parseImport, mergeImport, exportRecords };
  root.ReviewLogic = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
const ITEMS = JSON.parse(document.getElementById('data').textContent);
const VOCAB = {"muscles": ["abdominals", "abductors", "adductors", "biceps", "calves", "chest", "forearms", "glutes", "hamstrings", "lats", "lower back", "middle back", "neck", "quadriceps", "shoulders", "traps", "triceps", "hip flexors", "thoracic spine"], "types": ["strength", "conditioning", "mobility", "stretch", "stability"], "purposes": ["hip flexors / sitting stiffness", "lower back comfort", "desk breaks", "wrists", "knees", "shoulder health"]};
const L = window.ReviewLogic;
const KEY = 'ig-review-v2', OLD_KEY = 'ig-review-v1';
const DIM_LABEL = { muscles: 'Muscles', types: 'Type', purposes: 'Purpose' };

function loadStore(){
  try {
    const v2 = localStorage.getItem(KEY);
    if (v2) return Object.assign(L.emptyStore(), JSON.parse(v2));
    const v1 = localStorage.getItem(OLD_KEY);   // left in place as a backup
    if (v1) return L.migrateV1(JSON.parse(v1));
  } catch (e) {}
  return L.emptyStore();
}
let store = loadStore();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };
save();

let openDim = null;            // which dropdown is open (UI only, not saved)
let refocusNew = false;

const GROUPS = [['fitness','Workout collections'],['uncollected','No collection'],['other','Other collections'],['all','All']];
const STATUSES = [['all','Any'],['undecided','Undecided'],['keep','Kept'],['discard','Discarded'],['needs','Kept, moves missing'],['new','New since last import']];
const statusOf = i => store.decisions[i.id] || 'undecided';
const needsMoves = i => store.decisions[i.id]==='keep' && !i.listed && !(store.moves[i.id]||'').trim();
const purposeList = () => [...new Set([...VOCAB.purposes, ...store.extraPurposes])];
const optionsFor = dim => dim==='purposes' ? purposeList() : VOCAB[dim];
const matchesStatus = i => {
  switch (store.status) {
    case 'all': return true;
    case 'needs': return needsMoves(i);
    case 'new': return !store.importedIds.includes(i.id);
    default: return statusOf(i)===store.status;
  }
};
const visible = () => ITEMS.filter(i => (store.group==='all' || i.group===store.group) && matchesStatus(i));

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

function seg(node, opts, key){
  node.innerHTML = '';
  for (const [v,label] of opts){
    const b = el('button', store[key]===v ? 'on' : '', label + (key==='group' ? ` (${ITEMS.filter(i=>v==='all'||i.group===v).length})` : ''));
    b.onclick = () => { store[key]=v; openDim=null; save(); render(); };
    node.appendChild(b);
  }
}

function render(){
  seg(document.getElementById('groupSeg'), GROUPS, 'group');
  seg(document.getElementById('statusSeg'), STATUSES, 'status');
  const vis = visible();
  if (!vis.find(i=>i.id===store.cur)) store.cur = vis[0]?.id ?? null;

  const scope = ITEMS.filter(i => store.group==='all' || i.group===store.group);
  const k = scope.filter(i=>statusOf(i)==='keep').length, dd = scope.filter(i=>statusOf(i)==='discard').length;
  const nm = scope.filter(needsMoves).length;
  document.getElementById('stats').textContent = `${k} kept · ${dd} discarded · ${scope.length-k-dd} left` + (nm ? ` · ${nm} need moves` : '');

  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const i of vis){
    const row = el('div', i.id===store.cur ? 'cur' : '');
    row.append(el('span', 'dot ' + statusOf(i) + (needsMoves(i) ? ' need' : '')),
               el('span', 't', i.caption.split('\n').find(l=>l.trim()) || '(no caption)'),
               el('span', 'o', i.owner));
    row.onclick = () => { store.cur = i.id; openDim=null; save(); render(); };
    list.appendChild(row);
  }
  list.querySelector('.cur')?.scrollIntoView({block:'nearest'});
  renderView(vis);
}

// What is on screen now. The video column is only rebuilt when the post or the
// video toggle changes, so tagging or deciding never reloads the Instagram embed.
let shown = { id:null, embed:null, left:null };

function renderView(vis){
  const v = document.getElementById('view');
  const i = ITEMS.find(x=>x.id===store.cur);
  if (!i){ v.innerHTML = ''; shown = { id:null, embed:null, left:null }; v.appendChild(el('p','empty','Nothing here. Change the filters above.')); return; }
  const left = buildLeft(i, vis);
  if (shown.id===i.id && shown.embed===store.embed && shown.left?.isConnected){
    shown.left.replaceWith(left);
    shown.left = left;
    return;
  }
  v.innerHTML = '';
  const wrap = el('div','wrap'), right = el('div');
  right.appendChild(buildEmbed(i));
  wrap.append(left, right);
  v.appendChild(wrap);
  v.scrollTop = 0;
  shown = { id:i.id, embed:store.embed, left };
}

function setTags(i, dim, values){ store.tags[dim][i.id] = [...new Set(values)]; save(); render(); }

function addPurpose(i, query){
  const list = purposeList();
  const m = L.matchPurpose(query, list);
  let value = m.exact || m.matches[0];          // existing values win over creating near-duplicates
  if (!value){
    value = query.trim().toLowerCase().replace(/\s+/g,' ');
    if (!value) return;
    store.extraPurposes.push(value);
  }
  refocusNew = true;
  const cur = L.tagsOf(i, store, 'purposes').values;
  setTags(i, 'purposes', cur.includes(value) ? cur : [...cur, value]);
}

function dropdown(i, dim){
  const t = L.tagsOf(i, store, dim);
  const box = el('div', 'dd' + (openDim===dim ? ' open' : ''));
  box.dataset.dim = dim;
  const lbl = el('div','lbl', DIM_LABEL[dim]);
  if (!t.confirmed && t.values.length) lbl.appendChild(el('em', null, 'dashed = my guess from the caption'));
  box.appendChild(lbl);

  const head = el('div','dd-head');
  const tog = el('button','dd-toggle'); tog.type = 'button';
  if (t.values.length) for (const v of t.values) tog.appendChild(el('span', 'chip ' + (t.confirmed ? 'on' : 'guess'), v));
  else tog.appendChild(el('span','none', 'none, click to choose'));
  tog.onclick = () => { openDim = openDim===dim ? null : dim; render(); };
  head.appendChild(tog);
  if (!t.confirmed && t.values.length){
    const ok = el('button','dd-ok','✓ guess is right'); ok.type = 'button';
    ok.onclick = () => setTags(i, dim, t.values);
    head.appendChild(ok);
  }
  box.appendChild(head);

  if (openDim===dim){
    const panel = el('div','dd-panel');
    const labels = [];
    for (const v of optionsFor(dim)){
      const lab = el('label');
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = v; cb.checked = t.values.includes(v);
      cb.onchange = () => setTags(i, dim, cb.checked ? [...t.values, v] : t.values.filter(x=>x!==v));
      lab.append(cb, document.createTextNode(v));
      panel.appendChild(lab); labels.push([v, lab]);
    }
    if (dim==='purposes'){
      const inp = el('input','dd-new'); inp.placeholder = 'Type to filter, Enter to pick or add a new purpose';
      inp.oninput = () => {
        const ok = new Set(L.matchPurpose(inp.value, labels.map(x=>x[0])).matches);
        for (const [v, lab] of labels) lab.style.display = ok.has(v) ? '' : 'none';
      };
      inp.onkeydown = e => { if (e.key==='Enter'){ e.preventDefault(); addPurpose(i, inp.value); } };
      panel.appendChild(inp);
      if (refocusNew){ refocusNew = false; queueMicrotask(() => inp.focus()); }
    }
    box.appendChild(panel);
  }
  return box;
}

function buildLeft(i, vis){
  const idx = vis.indexOf(i);
  const left = el('div');

  const meta = el('div','meta');
  meta.append(el('span','owner','@'+i.owner), el('span','m',i.time), el('span','m',`${idx+1} / ${vis.length}`));
  const a = el('a',null,'Open on Instagram ↗'); a.href=i.url; a.target='_blank'; a.rel='noopener';
  meta.appendChild(a);
  left.appendChild(meta);

  const chips = el('div','chips');
  for (const c of (i.collections.length ? i.collections : ['no collection'])) chips.appendChild(el('span','chip',c));
  left.appendChild(chips);

  if (i.note) left.appendChild(el('div','flag','Possible duplicate: '+i.note));
  if (i.suggest && !store.decisions[i.id]) left.appendChild(el('div','flag','Suggested: '+i.suggest+' (not fitness)'));

  const act = el('div','actions');
  const st = statusOf(i);
  const kb = el('button','btn k'+(st==='keep'?' on':''),'Keep'); kb.appendChild(el('kbd',null,'K'));
  const db = el('button','btn d'+(st==='discard'?' on':''),'Discard'); db.appendChild(el('kbd',null,'D'));
  const ub = el('button','btn','Clear'); ub.appendChild(el('kbd',null,'U'));
  kb.onclick=()=>decide('keep'); db.onclick=()=>decide('discard'); ub.onclick=()=>decide(null);
  act.append(kb, db, ub);
  left.appendChild(act);

  for (const dim of L.DIMS) left.appendChild(dropdown(i, dim));

  left.appendChild(el('div', 'badge ' + (i.listed ? 'ok' : 'need'),
    i.listed ? 'Caption lists the moves. Typing them is optional.' : 'Caption is vague. Type the moves you see in the video.'));
  const mv = el('textarea','moves'); mv.placeholder = 'Moves, one per line or comma separated. Rough names are fine, e.g. "bird dog, 90/90, kneeling thing at 0:20"';
  mv.value = store.moves[i.id] || '';
  mv.oninput = () => { if (mv.value.trim()) store.moves[i.id]=mv.value; else delete store.moves[i.id]; save(); };
  left.appendChild(mv);

  const ta = el('textarea'); ta.placeholder = 'Optional note, e.g. "only moves 2-4" or "too advanced for now"';
  ta.value = store.notes[i.id] || '';
  ta.oninput = () => { if (ta.value) store.notes[i.id]=ta.value; else delete store.notes[i.id]; save(); };
  left.appendChild(ta);

  left.appendChild(el('div','cap', i.caption || '(no caption)'));
  left.appendChild(el('p','help','Shortcuts: ← → or J/L move · K keep · D discard · U clear · V toggle video · Esc closes a dropdown · shortcuts pause while typing or while a dropdown is open · everything auto-saves in this browser'));
  return left;
}

function buildEmbed(i){
  const emb = el('div','embed');
  if (store.embed){
    const f = document.createElement('iframe');
    f.src = `https://www.instagram.com/p/${encodeURIComponent(i.id)}/embed/`;
    f.loading = 'lazy'; f.allow = 'encrypted-media; picture-in-picture';
    emb.appendChild(f);
  } else {
    emb.appendChild(el('div','off','Video hidden. Press V to show it.'));
  }
  return emb;
}

function move(d){
  const vis = visible(); const n = vis.findIndex(i=>i.id===store.cur);
  const nx = vis[Math.min(vis.length-1, Math.max(0, n+d))];
  if (nx){ store.cur = nx.id; openDim = null; save(); render(); }
}
function decide(val){
  const vis = visible(); const n = vis.findIndex(i=>i.id===store.cur);
  if (n<0) return;
  if (val) store.decisions[store.cur]=val; else delete store.decisions[store.cur];
  // advance to the next post in the current filter (it may drop out of an "Undecided" view)
  const after = vis.slice(n+1).find(i=>visible().includes(i)) || visible()[0];
  if (val && after){ store.cur = after.id; openDim = null; }
  save(); render();
}

document.addEventListener('keydown', e => {
  if (e.key==='Escape' && openDim){ openDim = null; render(); e.preventDefault(); return; }
  if (openDim || e.target.tagName==='TEXTAREA' || e.target.tagName==='INPUT') return;
  const k = e.key.toLowerCase();
  if (k==='arrowright'||k==='l') move(1);
  else if (k==='arrowleft'||k==='j') move(-1);
  else if (k==='k') decide('keep');
  else if (k==='d') decide('discard');
  else if (k==='u') decide(null);
  else if (k==='v'){ store.embed=!store.embed; save(); render(); }
  else return;
  e.preventDefault();
});

// Clicking anywhere outside an open dropdown closes it.
document.addEventListener('click', e => {
  if (openDim && !e.target.closest('.dd')){ openDim = null; render(); }
});

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.textContent = ''; }, 6000);
}

document.getElementById('importBtn').onclick = () => document.getElementById('importInput').click();
document.getElementById('importInput').onchange = async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const previous = store;
  try {
    const parsed = L.parseImport(await file.text());
    store = L.mergeImport(store, parsed);
    render();                    // only keep the merge if it renders
    save();
    toast(`Imported ${parsed.records.length} posts. Your local decisions were kept where they differ.`);
  } catch (err) {
    store = previous;
    render();
    toast(`Could not import ${file.name}: ${err.message}. Nothing was changed.`);
  }
};

document.getElementById('exportBtn').onclick = () => {
  const out = L.exportRecords(ITEMS, store, VOCAB);
  const blob = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'review-decisions.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};

render();
</script>
</body>
</html>
