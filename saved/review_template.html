<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Posts Review</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--muted:#6f6c66;--line:#e3e0da;
  --keep:#2f7d4f;--keep-bg:#e3f2e8;--drop:#b2412f;--drop-bg:#f8e4e0;--accent:#3a5bd9;--hint:#8a6d1f;--hint-bg:#f7efd9;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--panel:#1d1d1b;--ink:#ecebe7;--muted:#9c9890;--line:#33322f;
  --keep:#6cc28d;--keep-bg:#1f3428;--drop:#e98a78;--drop-bg:#3a2420;--accent:#8ea4ff;--hint:#e3c56f;--hint-bg:#3a321c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;margin:0 8px 0 0}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:5px 10px;cursor:pointer;font:inherit}
.seg button.on{background:var(--ink);color:var(--bg)}
.stats{color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--muted)}
main{flex:1;display:flex;min-height:0}
#list{width:300px;overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}
#list div{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:baseline}
#list div.cur{background:var(--bg);box-shadow:inset 3px 0 0 var(--accent)}
#list .dot{width:8px;height:8px;border-radius:50%;flex:none;border:1px solid var(--muted)}
#list .dot.keep{background:var(--keep);border-color:var(--keep)}
#list .dot.discard{background:var(--drop);border-color:var(--drop)}
#list .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list .o{color:var(--muted);font-size:12px;flex:none}
#view{flex:1;overflow-y:auto;padding:20px 24px}
.wrap{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:24px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:10px}
.meta .owner{font-weight:600;font-size:16px}
.meta .m{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;color:var(--muted)}
.chip.c{color:var(--ink)}
.flag{background:var(--hint-bg);color:var(--hint);border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:13px}
.actions{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.actions .btn{padding:9px 16px;font-weight:600}
.actions .k.on{background:var(--keep-bg);border-color:var(--keep);color:var(--keep)}
.actions .d.on{background:var(--drop-bg);border-color:var(--drop);color:var(--drop)}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;color:var(--muted)}
textarea{width:100%;min-height:54px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;resize:vertical;margin-bottom:12px}
.cap{white-space:pre-wrap;word-wrap:break-word;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:none}
.embed{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center}
.embed iframe{width:100%;height:720px;border:0;display:block;background:#fff}
.embed .off{color:var(--muted);padding:30px;text-align:center}
.help{color:var(--muted);font-size:12px;margin-top:14px}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 5px;display:flex;gap:8px;align-items:baseline}
.lbl em{text-transform:none;letter-spacing:0;font-style:normal}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:2px 10px;font:inherit;font-size:12px;line-height:1.5;cursor:pointer}
.tag:hover{border-color:var(--muted)}
.tag.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tag.on.guess{background:transparent;color:var(--accent);border:1px dashed var(--accent)}
.tagin{border:1px dashed var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:2px 10px;font:inherit;font-size:12px;line-height:1.5;width:130px}
.badge{border-radius:8px;padding:5px 10px;font-size:13px;margin:12px 0 6px}
.badge.ok{background:var(--keep-bg);color:var(--keep)}
.badge.need{background:var(--hint-bg);color:var(--hint)}
textarea.moves{min-height:70px}
#list .dot.need{box-shadow:0 0 0 2px var(--hint)}
a{color:var(--accent)}
.empty{color:var(--muted);text-align:center;margin-top:80px}
@media (max-width:900px){
  #list{display:none}
  .wrap{grid-template-columns:1fr}
  #view{padding:16px}
  .embed iframe{height:600px}
}
</style>
</head>
<body>
<header>
  <h1>Saved posts</h1>
  <div class="seg" id="groupSeg"></div>
  <div class="seg" id="statusSeg"></div>
  <span class="stats" id="stats"></span>
  <button class="btn" id="exportBtn" title="Download your decisions as JSON">Export decisions</button>
</header>
<main>
  <nav id="list"></nav>
  <section id="view"></section>
</main>
<script id="data" type="application/json">/*DATA*/[]</script>
<script>
const ITEMS = JSON.parse(document.getElementById('data').textContent);
const KEY = 'ig-review-v1';
const MUSCLES = /*MUSCLES*/[];
const ROLES = ['desk reset','warm-up','cool-down','gym','home','finisher'];
const store = { decisions:{}, notes:{}, tags:{}, moves:{}, custom:[], group:'fitness', status:'all', embed:true, cur:null };
try { Object.assign(store, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

const GROUPS = [['fitness','Workout collections'],['uncollected','No collection'],['other','Other collections'],['all','All']];
const STATUSES = [['all','Any'],['undecided','Undecided'],['keep','Kept'],['discard','Discarded'],['needs','Kept, moves missing']];
const needsMoves = i => store.decisions[i.id]==='keep' && !i.listed && !(store.moves[i.id]||'').trim();
const tagsOf = i => store.tags[i.id] ?? i.tags;
const confirmed = i => i.id in store.tags;

function seg(el, opts, key){
  el.innerHTML = '';
  for (const [v,label] of opts){
    const b = document.createElement('button');
    b.textContent = label + (key==='group' ? ` (${ITEMS.filter(i=>v==='all'||i.group===v).length})` : '');
    b.className = store[key]===v ? 'on' : '';
    b.onclick = () => { store[key]=v; save(); render(); };
    el.appendChild(b);
  }
}
const statusOf = i => store.decisions[i.id] || 'undecided';
const visible = () => ITEMS.filter(i =>
  (store.group==='all' || i.group===store.group) &&
  (store.status==='all' || (store.status==='needs' ? needsMoves(i) : statusOf(i)===store.status)));

function render(){
  seg(document.getElementById('groupSeg'), GROUPS, 'group');
  seg(document.getElementById('statusSeg'), STATUSES, 'status');
  const vis = visible();
  if (!vis.find(i=>i.id===store.cur)) store.cur = vis[0]?.id ?? null;

  const scope = ITEMS.filter(i => store.group==='all' || i.group===store.group);
  const k = scope.filter(i=>statusOf(i)==='keep').length, dd = scope.filter(i=>statusOf(i)==='discard').length;
  const nm = scope.filter(needsMoves).length;
  document.getElementById('stats').textContent = `${k} kept · ${dd} discarded · ${scope.length-k-dd} left` + (nm ? ` · ${nm} need moves` : '');

  const list = document.getElementById('list');
  list.innerHTML = '';
  for (const i of vis){
    const row = document.createElement('div');
    if (i.id===store.cur) row.className = 'cur';
    const dot = document.createElement('span'); dot.className = 'dot ' + statusOf(i) + (needsMoves(i) ? ' need' : '');
    const t = document.createElement('span'); t.className = 't';
    t.textContent = (i.caption.split('\n').find(l=>l.trim()) || '(no caption)');
    const o = document.createElement('span'); o.className = 'o'; o.textContent = i.owner;
    row.append(dot, t, o);
    row.onclick = () => { store.cur = i.id; save(); render(); };
    list.appendChild(row);
  }
  list.querySelector('.cur')?.scrollIntoView({block:'nearest'});
  renderView(vis);
}

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

// What is on screen now. The video column is only rebuilt when the post or the
// video toggle changes, so tagging or deciding never reloads the Instagram embed.
let shown = { id:null, embed:null, left:null };

function renderView(vis){
  const v = document.getElementById('view');
  const i = ITEMS.find(x=>x.id===store.cur);
  if (!i){ v.innerHTML = ''; shown = { id:null, embed:null, left:null }; v.appendChild(el('p','empty','Nothing here. Change the filters above.')); return; }
  const left = buildLeft(i, vis);
  if (shown.id===i.id && shown.embed===store.embed && shown.left?.isConnected){
    shown.left.replaceWith(left);
    shown.left = left;
    return;
  }
  v.innerHTML = '';
  const wrap = el('div','wrap'), right = el('div');
  right.appendChild(buildEmbed(i));
  wrap.append(left, right);
  v.appendChild(wrap);
  v.scrollTop = 0;
  shown = { id:i.id, embed:store.embed, left };
}

function buildLeft(i, vis){
  const idx = vis.indexOf(i);
  const left = el('div');

  const meta = el('div','meta');
  meta.append(el('span','owner','@'+i.owner), el('span','m',i.time), el('span','m',`${idx+1} / ${vis.length}`));
  const a = el('a',null,'Open on Instagram ↗'); a.href=i.url; a.target='_blank'; a.rel='noopener';
  meta.appendChild(a);
  left.appendChild(meta);

  const chips = el('div','chips');
  for (const c of (i.collections.length ? i.collections : ['no collection'])) chips.appendChild(el('span','chip c',c));
  left.appendChild(chips);

  if (i.note) left.appendChild(el('div','flag','Possible duplicate: '+i.note));
  if (i.suggest && !store.decisions[i.id]) left.appendChild(el('div','flag','Suggested: '+i.suggest+' (not fitness)'));

  const act = el('div','actions');
  const st = statusOf(i);
  const kb = el('button','btn k'+(st==='keep'?' on':''),'Keep'); kb.appendChild(el('kbd',null,'K'));
  const db = el('button','btn d'+(st==='discard'?' on':''),'Discard'); db.appendChild(el('kbd',null,'D'));
  const ub = el('button','btn','Clear'); ub.appendChild(el('kbd',null,'U'));
  kb.onclick=()=>decide('keep'); db.onclick=()=>decide('discard'); ub.onclick=()=>decide(null);
  act.append(kb, db, ub);
  left.appendChild(act);

  left.appendChild(tagSection(i));

  left.appendChild(el('div', 'badge ' + (i.listed ? 'ok' : 'need'),
    i.listed ? 'Caption lists the moves. Typing them is optional.' : 'Caption is vague. Type the moves you see in the video.'));
  const mv = el('textarea','moves'); mv.placeholder = 'Moves, one per line or comma separated. Rough names are fine, e.g. "bird dog, 90/90, kneeling thing at 0:20"';
  mv.value = store.moves[i.id] || '';
  mv.oninput = () => { if (mv.value.trim()) store.moves[i.id]=mv.value; else delete store.moves[i.id]; save(); };
  left.appendChild(mv);

  const ta = el('textarea'); ta.placeholder = 'Optional note, e.g. "only moves 2-4" or "too advanced for now"';
  ta.value = store.notes[i.id] || '';
  ta.oninput = () => { if (ta.value) store.notes[i.id]=ta.value; else delete store.notes[i.id]; save(); };
  left.appendChild(ta);

  left.appendChild(el('div','cap', i.caption || '(no caption)'));
  left.appendChild(el('p','help','Shortcuts: ← → or J/L move · K keep · D discard · U clear · V toggle video · shortcuts pause while typing · everything auto-saves in this browser'));
  return left;
}

function buildEmbed(i){
  const emb = el('div','embed');
  if (store.embed){
    const f = document.createElement('iframe');
    f.src = `https://www.instagram.com/p/${encodeURIComponent(i.id)}/embed/`;
    f.loading = 'lazy'; f.allow = 'encrypted-media; picture-in-picture';
    emb.appendChild(f);
  } else {
    emb.appendChild(el('div','off','Video hidden. Press V to show it.'));
  }
  return emb;
}

let refocusTagInput = false;
function setTags(i, list){ store.tags[i.id] = [...new Set(list)]; save(); render(); }
function toggleTag(i, t){
  const cur = tagsOf(i);
  setTags(i, cur.includes(t) ? cur.filter(x=>x!==t) : [...cur, t]);
}
function tagRow(i, label, names, hint){
  const frag = document.createDocumentFragment();
  const l = el('div','lbl',label); if (hint) l.appendChild(el('em',null,hint));
  frag.appendChild(l);
  const row = el('div','tags');
  const cur = tagsOf(i), guess = !confirmed(i);
  for (const t of names){
    const b = el('button','tag' + (cur.includes(t) ? ' on' : '') + (guess && MUSCLES.includes(t) ? ' guess' : ''), t);
    b.onclick = () => toggleTag(i, t);
    row.appendChild(b);
  }
  frag.appendChild(row);
  return [frag, row];
}
function tagSection(i){
  const box = el('div');
  const g = !confirmed(i) && i.tags.length;
  const [mFrag, mRow] = tagRow(i, 'Muscles', MUSCLES, g ? 'dashed = my guess from the caption; click any tag to confirm or fix' : '');
  if (g){
    const ok = el('button','tag','✓ guess is right');
    ok.onclick = () => setTags(i, tagsOf(i));
    mRow.appendChild(ok);
  }
  box.appendChild(mFrag);
  box.appendChild(tagRow(i, 'Role', ROLES)[0]);
  const [frag, row] = tagRow(i, 'Your tags', store.custom, 'type and press Enter to add a new one');
  const inp = el('input','tagin'); inp.placeholder = '+ new tag';
  inp.onkeydown = e => {
    if (e.key !== 'Enter') return;
    const t = inp.value.trim().toLowerCase(); if (!t) return;
    if (!store.custom.includes(t) && !MUSCLES.includes(t) && !ROLES.includes(t)) store.custom.push(t);
    refocusTagInput = true;
    setTags(i, [...tagsOf(i), t]);
  };
  row.appendChild(inp);
  if (refocusTagInput){ refocusTagInput = false; queueMicrotask(() => inp.focus()); }
  box.appendChild(frag);
  return box;
}

function move(d){
  const vis = visible(); const n = vis.findIndex(i=>i.id===store.cur);
  const nx = vis[Math.min(vis.length-1, Math.max(0, n+d))];
  if (nx){ store.cur = nx.id; save(); render(); }
}
function decide(val){
  const vis = visible(); const n = vis.findIndex(i=>i.id===store.cur);
  if (n<0) return;
  if (val) store.decisions[store.cur]=val; else delete store.decisions[store.cur];
  // advance to the next post in the current filter (it may drop out of an "Undecided" view)
  const after = vis.slice(n+1).find(i=>visible().includes(i)) || visible()[0];
  if (val && after) store.cur = after.id;
  save(); render();
}

document.addEventListener('keydown', e => {
  if (e.target.tagName==='TEXTAREA' || e.target.tagName==='INPUT') return;
  const k = e.key.toLowerCase();
  if (k==='arrowright'||k==='l') move(1);
  else if (k==='arrowleft'||k==='j') move(-1);
  else if (k==='k') decide('keep');
  else if (k==='d') decide('discard');
  else if (k==='u') decide(null);
  else if (k==='v'){ store.embed=!store.embed; save(); render(); }
  else return;
  e.preventDefault();
});

document.getElementById('exportBtn').onclick = () => {
  const out = ITEMS.map(i => ({ id:i.id, url:i.url, owner:i.owner, collections:i.collections,
    decision: store.decisions[i.id] || 'undecided',
    tags: tagsOf(i), tagsConfirmed: confirmed(i), captionListsMoves: i.listed,
    moves: store.moves[i.id] || '', note: store.notes[i.id] || '', caption: i.caption }));
  const blob = new Blob([JSON.stringify(out, null, 1)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'review-decisions.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};

render();
</script>
</body>
</html>
